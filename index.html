<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채용공고 관리</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#f5f5f5;color:#222;font-size:14px}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
header h1{font-size:18px;color:#4F4F4F}
.row{display:flex;gap:16px}
.col-edit{flex:1;min-width:0}
.col-preview{flex:1;min-width:0}
@media(max-width:900px){.row{flex-direction:column}}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;background:#e5e5e5;border:none;color:#555;transition:transform 0.15s}
.tab:hover{background:#d5d5d5}
.tab.on{background:#4DD2A7;color:#fff}
.tab[draggable]{cursor:grab}
.tab.dragging{opacity:0.4;transform:scale(0.95)}
.tab.drag-over-left{box-shadow:-3px 0 0 0 #4DD2A7}
.tab.drag-over-right{box-shadow:3px 0 0 0 #4DD2A7}

/* Card */
.card{background:#fff;border:1px solid #ddd;border-radius:8px;margin-bottom:12px}
.card-h{padding:10px 14px;border-bottom:1px solid #eee;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.card-b{padding:14px}

/* Form */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:#666;margin-bottom:4px}
.field textarea{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font:13px/1.7 inherit;resize:vertical;min-height:80px;outline:none}
.field textarea:focus{border-color:#4DD2A7}
.field input{width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:6px;font:13px inherit;outline:none}

/* Buttons */
.btn{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #ddd;background:#fff;color:#333}
.btn:hover{background:#f0f0f0}
.btn-b{background:#4DD2A7;color:#fff;border-color:#4DD2A7}
.btn-b:hover{background:#3cb592}
.btn-g{background:#fff;color:#4F4F4F;border-color:#ccc}
.btn-g:hover{background:#f5f5f5}
.btn-r{background:#FF8770;color:#fff;border-color:#FF8770}
.btn-r:hover{background:#e6725c}
.btn-sm{padding:3px 8px;font-size:11px}

/* Preview */
.pv-box{background:#fafafa;border:1px solid #eee;border-radius:6px;padding:12px;font-size:13px;line-height:1.8;white-space:pre-wrap;word-break:break-word;max-height:400px;overflow-y:auto;position:relative}
.pv-html{white-space:normal}
.pv-html ul{padding-left:20px;margin:4px 0}
.pv-html li{margin:2px 0}
.pv-html h3{font-size:14px;font-weight:700;margin:14px 0 6px}
.pv-html h3:first-child{margin-top:0}
.pv-html p{margin:4px 0}

/* Copy section */
.cp-sec{border:1px solid #eee;border-radius:6px;margin-bottom:8px;overflow:hidden}
.cp-h{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#f8f8f8;border-bottom:1px solid #eee}
.cp-h span{font-size:12px;font-weight:600}
.cp-field-hint{font-weight:400!important;color:#999!important;font-size:11px!important;margin-left:6px;flex:1}
.cp-body{padding:8px 12px;font-size:12px;line-height:1.7;max-height:160px;overflow-y:auto;white-space:pre-wrap;color:#666}

/* Toast */
.toast{position:fixed;bottom:16px;right:16px;background:#4F4F4F;color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:99;display:none}

/* Tag */
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700}
.tag-b{background:#e0f7ef;color:#2a9d75}
.tag-g{background:#e0f7ef;color:#3cb592}
.tag-y{background:#fff3e0;color:#92400e}

/* Modal */
.modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;width:95%;max-width:720px;max-height:85vh;overflow-y:auto;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.modal h2{font-size:16px;margin-bottom:14px}
.modal h3{font-size:13px;margin:16px 0 8px;color:#666}

/* Section list in modal */
.sec-row{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid #eee;border-radius:6px;margin-bottom:4px;background:#fff}
.sec-row:hover{background:#f8f8f8}
.sec-row .sec-name{flex:1;font-size:13px;font-weight:600}
.sec-row .sec-key{font-size:10px;color:#999;margin-left:4px}
.sec-row select{font-size:11px;padding:2px 4px;border:1px solid #ddd;border-radius:4px}
.arrow-btn{width:24px;height:24px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.arrow-btn:hover{background:#f0f0f0}

/* Platform field config */
.pf-row{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid #eee;border-radius:6px;margin-bottom:4px;background:#fff}
.pf-row:hover{background:#f8f8f8}
.pf-label{font-size:12px;font-weight:600;min-width:100px}
.pf-sections{flex:1;display:flex;gap:3px;flex-wrap:wrap}
.pf-tag{font-size:10px;padding:2px 6px;border-radius:4px;background:#e5e5e5;cursor:pointer;user-select:none}
.pf-tag.active{background:#e0f7ef;color:#2a9d75}

/* Line break control */
.lb-ctrl{display:flex;align-items:center;gap:0;background:#f8f8f8;border:1px solid #eee;border-radius:8px;padding:4px 10px;width:fit-content}
.lb-item{display:flex;align-items:center;gap:4px}
.lb-label{font-size:11px;color:#666;font-weight:600;white-space:nowrap}
.lb-btn{width:22px;height:22px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;font-size:13px;font-weight:700;color:#555;display:flex;align-items:center;justify-content:center;line-height:1}
.lb-btn:hover{background:#e5e5e5}
.lb-val{font-size:13px;font-weight:700;color:#4DD2A7;min-width:16px;text-align:center}
.lb-unit{font-size:10px;color:#999}
.lb-sep{width:1px;height:16px;background:#ddd;margin:0 10px}

/* Platform desc */
.plt-desc{font-size:11px;color:#888;background:#f8f8f8;border:1px solid #eee;border-radius:6px;padding:8px 12px;margin-bottom:10px;line-height:1.5}

/* Platform tab groups */
.plt-groups{display:flex;flex-direction:column;gap:6px}
.plt-row{display:flex;align-items:center;gap:4px}
.plt-label{font-size:10px;font-weight:700;color:#fff;background:#999;border-radius:4px;padding:2px 7px;white-space:nowrap;min-width:56px;text-align:center}
.plt-label.t-separate{background:#4DD2A7}
.plt-label.t-single{background:#6DD0F8}
.plt-label.t-html{background:#FF8770}
/* t-fullhtml은 html 그룹으로 통합 */
.plt-row .tab{padding:4px 10px;font-size:11px}

/* Position bar */
.pos-bar{display:flex;align-items:flex-start;gap:6px;margin-bottom:12px}
.pos-tabs-wrap{display:flex;flex:1;min-width:0;align-items:flex-start;gap:4px}
.pos-tabs-fixed{display:flex;gap:4px;align-items:center;flex-shrink:0}
.pos-tabs-scroll{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0;align-items:center}
.pos-actions{display:flex;gap:4px;flex-shrink:0;align-items:flex-start}
.tab-common{background:#e0f7ef!important;color:#2a9d75!important}
.tab-common.on{background:#4DD2A7!important;color:#fff!important}
.tab-sep{width:1px;height:22px;background:#ccc;flex-shrink:0;align-self:center}

/* Control bar (lb + batch copy) */
.ctrl-row{display:flex;align-items:center;gap:0;margin:8px 0 4px;justify-content:space-between}
.batch-btns{display:flex;gap:4px;align-items:center}

/* Job title slot (편집기 헤더) */
.jt-slot{width:100%;font-size:13px;font-weight:600;color:#4F4F4F;border:1px solid #ddd;border-radius:6px;padding:6px 8px;background:#fff;outline:none}
.jt-slot:focus{border-color:#4DD2A7;background:#f0faf6}

/* Job title in preview */
.jt-sec .cp-h{background:#f8f8f8}

/* Language toggle */
.lang-toggle{display:flex;gap:2px;align-items:center}
.lang-btn{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;border:1px solid #ddd;background:#fff;cursor:pointer;color:#666}
.lang-btn:hover{background:#f0f0f0}
.lang-btn.on{background:#4DD2A7;color:#fff;border-color:#4DD2A7}
.lang-tag{font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px;margin-left:3px;vertical-align:middle}
.lang-tag-ko{background:#fef3c7;color:#92400e}
.lang-tag-en{background:#dff4fb;color:#3aafda}

/* Position status */
.status-tag{font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;margin-left:2px;vertical-align:middle}
.status-draft{background:#f3f4f6;color:#6b7280}
.status-active{background:#e0f7ef;color:#3cb592}
.status-closed{background:#ffe8e3;color:#e6725c}
.status-select{font-size:11px;padding:2px 4px;border:1px solid #ddd;border-radius:4px;margin-left:6px}

/* Posted platform checkbox row */
.posted-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.posted-row label{font-size:11px;color:#666;cursor:pointer;display:flex;align-items:center;gap:4px}
.posted-row input[type=checkbox]{margin:0;cursor:pointer}
.posted-check{accent-color:#4DD2A7}

/* Archive button */
.btn-archive{background:#6DD0F8;color:#fff;border-color:#6DD0F8}
.btn-archive:hover{background:#55b8e0}

/* Drag handle */
.drag-handle{cursor:grab;color:#aaa;font-size:16px;line-height:1;padding:0 4px;user-select:none;flex-shrink:0}
.drag-handle:hover{color:#666}
.drag-handle:active{cursor:grabbing}
/* Drag states for cards & rows */
.plt-card{transition:box-shadow 0.15s,opacity 0.15s}
.plt-card.dragging{opacity:0.4;box-shadow:0 0 0 2px #4DD2A7}
.plt-card.drag-over{box-shadow:0 -3px 0 0 #4DD2A7}
.pf-row.dragging{opacity:0.4}
.pf-row.drag-over{box-shadow:0 -3px 0 0 #4DD2A7}
.sec-row.dragging{opacity:0.4}
.sec-row.drag-over{box-shadow:0 -3px 0 0 #4DD2A7}

/* Supabase sync */
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.sync-dot.off{background:#ccc}
.sync-dot.ok{background:#4DD2A7}
.sync-dot.err{background:#dc2626}
.sync-dot.syncing{background:#f59e0b;animation:pulse .8s infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.4}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>채용공고 관리 도구</h1>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <button class="btn btn-sm" onclick="undo()" title="실행 취소 (Ctrl+Z)">↩ 취소</button>
      <button class="btn btn-sm" onclick="redo()" title="다시 실행 (Ctrl+Y)">↪ 재실행</button>
      <span style="width:1px;height:18px;background:#ddd;margin:0 2px"></span>
      <button class="btn btn-sm btn-g" onclick="exportData()">💾 저장</button>
      <span id="localBtns"><button class="btn btn-sm" onclick="document.getElementById('importFile').click()">📂 불러오기</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)"></span>
      <button class="btn btn-sm" onclick="openArchive()">📦 보관함</button>
      <span style="width:1px;height:18px;background:#ddd;margin:0 2px"></span>
      <button class="btn btn-sm" onclick="openSectionMgr()">⚙️ 섹션 관리</button>
      <button class="btn btn-sm" onclick="openPlatformMgr()">📋 플랫폼 설정</button>
      <span style="width:1px;height:18px;background:#ddd;margin:0 2px"></span>
      <button class="btn btn-sm" id="syncBtn" onclick="openSupabaseMgr()" title="클라우드 동기화 설정"><span class="sync-dot off" id="syncDot"></span>Cloud</button>
    </div>
  </header>

  <!-- Position Tabs (공통 + 포지션 한 줄) -->
  <div class="pos-bar">
    <div class="pos-tabs-wrap" id="posTabs"></div>
    <div class="pos-actions">
      <button class="btn btn-b btn-sm" onclick="addPosition()">+ 추가</button>
      <button class="btn btn-sm" onclick="duplicatePosition()">복사</button>
      <button class="btn btn-sm btn-archive" onclick="archivePosition()">보관</button>
      <button class="btn btn-r btn-sm" onclick="removePosition()">삭제</button>
    </div>
  </div>
  <div class="row">
    <!-- Editor -->
    <div class="col-edit">
      <div class="card">
        <div class="card-h"><span>📝 편집기</span></div>
        <div class="card-b" id="editor"></div>
      </div>
    </div>

    <!-- Preview -->
    <div class="col-preview">
      <div class="card">
        <div class="card-h">
          <span>👁️ 플랫폼 미리보기 / 복사</span>
        </div>
        <div class="card-b">
          <div class="tabs" id="pltTabs"></div>
          <div class="ctrl-row">
            <div class="lb-ctrl">
              <div class="lb-item">
                <span class="lb-label">섹션 간</span>
                <button class="lb-btn" onclick="adjLB('between',-1)">−</button>
                <span class="lb-val" id="lbBetween">2</span>
                <button class="lb-btn" onclick="adjLB('between',1)">+</button>
                <span class="lb-unit">줄</span>
              </div>
              <div class="lb-sep"></div>
              <div class="lb-item">
                <span class="lb-label">합쳐진 섹션 내</span>
                <button class="lb-btn" onclick="adjLB('within',-1)">−</button>
                <span class="lb-val" id="lbWithin">1</span>
                <button class="lb-btn" onclick="adjLB('within',1)">+</button>
                <span class="lb-unit">줄</span>
              </div>
            </div>
            <div class="batch-btns">
              <button class="btn btn-sm btn-b" id="batchBtn" onclick="batchStep()" title="클릭할 때마다 한 칸씩 순서대로 복사">일괄복사</button>
              <button class="btn btn-sm" onclick="batchReverse()" title="순서 반전">⇅</button>
              <button class="btn btn-sm" onclick="batchReset()" title="처음부터 다시">↺</button>
            </div>
          </div>
          <div id="preview" style="margin-top:12px"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

// ── Undo/Redo ──
const UNDO_MAX = 20;
let _undoStack = [];
let _redoStack = [];
let _skipSnapshot = false; // undo/redo 복원 시 재귀 방지

function _pushUndo(){
  if(_skipSnapshot) return;
  _undoStack.push(JSON.stringify(D));
  if(_undoStack.length > UNDO_MAX) _undoStack.shift();
  _redoStack = []; // 새 변경이 생기면 redo 스택 초기화
}

function undo(){
  if(!_undoStack.length){ toast('되돌릴 내용이 없습니다'); return; }
  _redoStack.push(JSON.stringify(D));
  const snap = _undoStack.pop();
  _skipSnapshot = true;
  D = JSON.parse(snap);
  localStorage.setItem(LS_KEY, snap);
  _dirty = true;
  if(_fileHandle) { _writeToHandle(); _dirty = false; }
  _skipSnapshot = false;
  // curPos 유효성 검사
  if(curPos !== '__common__' && !D.positions.includes(curPos)) curPos = D.positions[0] || '';
  render();
  toast('실행 취소');
}

function redo(){
  if(!_redoStack.length){ toast('다시 실행할 내용이 없습니다'); return; }
  _undoStack.push(JSON.stringify(D));
  const snap = _redoStack.pop();
  _skipSnapshot = true;
  D = JSON.parse(snap);
  localStorage.setItem(LS_KEY, snap);
  _dirty = true;
  if(_fileHandle) { _writeToHandle(); _dirty = false; }
  _skipSnapshot = false;
  if(curPos !== '__common__' && !D.positions.includes(curPos)) curPos = D.positions[0] || '';
  render();
  toast('다시 실행');
}

// 비동기 초기화: IndexedDB에 더 최신 데이터가 있으면 반영

// 💾 저장 버튼: File System Access API 사용 가능하면 파일 핸들 획득 후 자동저장 연결
async function exportData(){

  // File System Access API 지원 시 → 파일 핸들 획득 (이후 자동저장)

      });

      _savedOnce = true; _dirty = false;

      return;

  // 폴백: 다운로드
  const blob = new Blob([json],{type:'application/json'});

  a.click();
  URL.revokeObjectURL(a.href);
  _savedOnce = true; _dirty = false;
  toast('데이터 파일 다운로드됨');
}

// ── Helpers ──
function $(id){return document.getElementById(id)}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
// onclick 속성 내 JS 단따옴표 문자열 이스케이프: \, ', ", 개행 처리
function escJs(s){ return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\n/g,'\\n').replace(/\r/g,''); }
// 미니 마크다운: **볼드**, [텍스트](url) → HTML 변환 (esc 후 적용)
// 링크는 http(s) 스킴만 허용 — javascript: 등은 클릭 시 실행되는 XSS 벡터이므로 원문 그대로 출력
function miniMd(s){
  let h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, text, url) =>
    /^https?:\/\//i.test(url.trim()) ? `<a href="${url}" target="_blank" style="color:#4DD2A7">${text}</a>` : m);
  return h;
}
function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',2000) }

function clip(text){
  navigator.clipboard.writeText(text).catch(()=>{
    const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);
  });
}
// 리치 HTML 복사 (ATS 에디터 붙여넣기 호환)
function clipHtml(html){
  // text/plain에는 태그 제거한 텍스트를 넣어야 일반 에디터에서도 깔끔
  const plainText = html.replace(/<br\s*\/?>/gi,'\n').replace(/<\/li>/gi,'\n').replace(/<\/p>/gi,'\n').replace(/<\/h[1-6]>/gi,'\n').replace(/<[^>]+>/g,'').replace(/\n{3,}/g,'\n\n').trim();
  // ClipboardItem API 사용 시도 (HTTPS/localhost에서만 동작)
  if(navigator.clipboard && typeof ClipboardItem !== 'undefined'){
    try {
      const blob = new Blob([html], {type:'text/html'});
      const textBlob = new Blob([plainText], {type:'text/plain'});
      navigator.clipboard.write([new ClipboardItem({'text/html': blob, 'text/plain': textBlob})])
        .then(()=>{})
        .catch(()=>{ _clipHtmlFallback(html); });
    } catch(e){ _clipHtmlFallback(html); }
  } else {
    _clipHtmlFallback(html);
  }
}
function _clipHtmlFallback(html){
  const div = document.createElement('div');
  div.innerHTML = html;
  div.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(div);
  const range = document.createRange();
  range.selectNodeContents(div);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
  try { document.execCommand('copy'); } catch(e){}
  sel.removeAllRanges();
  document.body.removeChild(div);
}

function bullets(text, b){
  if(!text) return '';
  return text.split('\n').map(l=>{
    const t=l.trim();
    if(/^[•·\-▸]\s/.test(t)) return b + t.replace(/^[•·\-▸]\s*/,'');
    return l;
  }).join('\n');
}

// clean=true → Quill 호환 순수 시맨틱 HTML, clean=false → 인라인 스타일 포함(미리보기/자체페이지용)
function toHtml(text, title, clean){
  if(!text) return '';
  let h = '';
  if(title) h = clean ? '<h3>'+esc(title)+'</h3>\n' : '<h3 style="font-size:16px;font-weight:bold;margin:18px 0 8px">'+esc(title)+'</h3>\n';
  let inUl = false;
  text.split('\n').forEach(l=>{
    const t=l.trim();
    if(!t){if(inUl){h+='</ul>\n';inUl=false;} return;}
    if(/^[•·\-▸]\s/.test(t)){
      if(!inUl){h+= clean ? '<ul>\n' : '<ul style="padding-left:22px">\n'; inUl=true;}
      h+= clean ? '<li>'+miniMd(t.replace(/^[•·\-▸]\s*/,''))+'</li>\n' : '<li style="margin:3px 0">'+miniMd(t.replace(/^[•·\-▸]\s*/,''))+'</li>\n';
    } else {
      if(inUl){h+='</ul>\n';inUl=false;}
      h+= clean ? '<p>'+miniMd(t)+'</p>\n' : '<p style="margin:5px 0">'+miniMd(t)+'</p>\n';
    }
  });
  if(inUl) h+='</ul>\n';
  return h;
}

function getPosDataKey(posName){
  if(!D.posLang) D.posLang = {};
  const lang = D.posLang[posName] || 'ko';
  return lang === 'en' ? posName + '__en' : posName;

function getVal(secKey, pos){
  const usePos = pos || curPos;
  const sec = D.sections.find(s=>s.key===secKey);
  // 공통 편집 모드일 때는 현재 선택된 공통 언어 데이터 반환
  if(usePos === '__common__'){
    const cdk = commonLang === 'en' ? '공통_en' : '공통';
    return (D.data[cdk]||{})[secKey] || '';
  }
  // 포지션 언어에 맞는 공통 데이터 선택
  const ck = getCommonKey(usePos);
  const c = (D.data[ck]||{})[secKey] || '';
  if(!sec) return c;
  if(!usePos || sec.commonOnly) return c;
  // 포지션 언어에 맞는 포지션별 데이터 선택
  const pdk = getPosDataKey(usePos);
  const p = (D.data[pdk]||{})[secKey] || '';
  if(p && c) return c+'\n\n'+p;
  return p || c;
}

function secName(k){ return D.sections.find(s=>s.key===k)?.name || k }

function genKey(name){
  // 한글 이름에서 key 생성
  const base = name.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9가-힣_]/g,'');
  let key = base || 'sec';
  let i = 1;
  while(D.sections.find(s=>s.key===key)){ key = base + '_' + (i++); }
  return key;
}

// ── 포지션 탭 드래그 앤 드롭 ──
let _dragIdx = -1;
function initTabDrag(){
  const wrap = $('posTabsInner') || $('posTabs');
  const tabs = wrap.querySelectorAll('.tab[draggable]');
  tabs.forEach(tab=>{
    tab.addEventListener('dragstart', e=>{
      _dragIdx = +tab.dataset.idx;
      tab.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    tab.addEventListener('dragend', ()=>{
      tab.classList.remove('dragging');
      wrap.querySelectorAll('.tab').forEach(t=>t.classList.remove('drag-over-left','drag-over-right'));
    });
    tab.addEventListener('dragover', e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const targetIdx = +tab.dataset.idx;
      if(targetIdx === _dragIdx) return;
      wrap.querySelectorAll('.tab').forEach(t=>t.classList.remove('drag-over-left','drag-over-right'));
      tab.classList.add(targetIdx < _dragIdx ? 'drag-over-left' : 'drag-over-right');
    });
    tab.addEventListener('dragleave', ()=>{
      tab.classList.remove('drag-over-left','drag-over-right');
    });
    tab.addEventListener('drop', e=>{
      e.preventDefault();
      const targetIdx = +tab.dataset.idx;
      if(targetIdx === _dragIdx || _dragIdx < 0) return;
      const item = D.positions.splice(_dragIdx, 1)[0];
      D.positions.splice(targetIdx, 0, item);
      save();
      render();
    });
  });
}

function render(){

  const isCommon = curPos==='__common__';

  // 공통 탭(고정) + 포지션 탭(wrap 영역 분리)
  let fixedH = `<button class="tab tab-common ${isCommon?'on':''}" onclick="curPos='__common__';render()">공통</button>`;
  if(D.positions.length) fixedH += `<span class="tab-sep"></span>`;

  if(!D.posStatus) D.posStatus = {};
  let posH = D.positions.map((p)=>{
    const lang = D.posLang[p] || 'ko';
    const langTag = `<span class="lang-tag lang-tag-${lang}">${lang.toUpperCase()}</span>`;
    const st = D.posStatus[p] || 'draft';
    const stTag = st !== 'draft' ? `<span class="status-tag status-${st}">${st==='active'?'Active':'Closed'}</span>` : '';
    const origIdx = D.positions.indexOf(p);
    return `<button class="tab ${p===curPos?'on':''}" draggable="true" data-idx="${origIdx}" onclick="curPos='${escJs(p)}';render()">${esc(D.jobTitles[p] || p)}${langTag}${stTag}</button>`;
  }).join('');

  $('posTabs').innerHTML = `<div class="pos-tabs-fixed">${fixedH}</div><div class="pos-tabs-scroll" id="posTabsInner">${posH}</div>`;
  initTabDrag();

  renderPlatformArea();
  renderEditor();
}

function renderPlatformTabs(){
  // fullhtml은 html 그룹에 통합 표시
  const typeOrder = ['separate','single','html'];
  const typeLabels = {separate:'개별', single:'통합', html:'HTML'};
  let pltH = '<div class="plt-groups">';
  typeOrder.forEach(type=>{
    const group = D.platforms.filter(p=> !p.hidden && (type==='html' ? (p.type==='html'||p.type==='fullhtml') : p.type===type));
    if(!group.length) return;
    pltH += `<div class="plt-row"><span class="plt-label t-${type}">${typeLabels[type]}</span>`;
    group.forEach(p=>{
      pltH += `<button class="tab ${p.id===curPlt?'on':''}" title="${esc(p.desc||'')}" onclick="curPlt='${p.id}';renderPlatformArea()">${esc(p.name)}</button>`;
    });
    pltH += '</div>';
  });
  pltH += '</div>';
  $('pltTabs').innerHTML = pltH;
}

function renderPlatformArea(){
  // 현재 선택된 플랫폼이 숨김이면 첫 번째 보이는 플랫폼으로 전환
  const curPltObj = D.platforms.find(p=>p.id===curPlt);
  if(!curPltObj || curPltObj.hidden){
    const first = D.platforms.find(p=>!p.hidden);
    if(first) curPlt = first.id;
  }
  renderPlatformTabs();
  renderPreview();
  BC.cells=[]; BC.labels=[]; BC.idx=0; updateBatchBtn();
}

function renderEditor(){
  if(!curPos && !D.positions.length){
    $('editor').innerHTML = '<p style="color:#999;text-align:center;padding:20px">상단에서 포지션을 추가하세요</p>';
    return;
  }

  const isCommonMode = curPos === '__common__';
  const commonDataKey = commonLang === 'en' ? '공통_en' : '공통';
  const commonLangLabel = commonLang.toUpperCase();
  let h = '';

  if(isCommonMode){
    // 공통 탭: KO/EN 토글 버튼
    h += `<div class="field"><label style="display:flex;align-items:center;gap:6px">공통 데이터 <span class="lang-toggle"><button class="lang-btn ${commonLang==='ko'?'on':''}" onclick="setCommonLang('ko')">KO</button><button class="lang-btn ${commonLang==='en'?'on':''}" onclick="setCommonLang('en')">EN</button></span></label></div>`;
    if(!D.data[commonDataKey]) D.data[commonDataKey] = {};
    D.sections.filter(sec=>sec.commonOnly).forEach(sec=>{
      const cv = (D.data[commonDataKey]||{})[sec.key] || '';
      h += `<div class="field"><label>${esc(sec.name)} <span class="tag tag-b">공통 ${commonLangLabel}</span></label>`;
      h += `<textarea data-t="c" data-k="${sec.key}" rows="${Math.max(3,cv.split('\n').length)}">${esc(cv)}</textarea>`;
      h += '</div>';
    });
  } else {
    // 공고명 슬랏 (첫 섹션 위) + 언어 토글 버튼
    if(!D.jobTitles) D.jobTitles = {};
    if(!D.posLang) D.posLang = {};
    const jtVal = D.jobTitles[curPos] || curPos;
    const posLang = D.posLang[curPos] || 'ko';
    if(!D.posStatus) D.posStatus = {};
    const curSt = D.posStatus[curPos] || 'draft';
    h += `<div class="field"><label style="display:flex;align-items:center;gap:6px">공고명 <span class="lang-toggle"><button class="lang-btn ${posLang==='ko'?'on':''}" onclick="setPosLang('ko')">KO</button><button class="lang-btn ${posLang==='en'?'on':''}" onclick="setPosLang('en')">EN</button></span><select class="status-select" onchange="setPosStatus(this.value)"><option value="draft"${curSt==='draft'?' selected':''}>Draft</option><option value="active"${curSt==='active'?' selected':''}>Active</option><option value="closed"${curSt==='closed'?' selected':''}>Closed</option></select></label>`;
    h += `<input class="jt-slot" value="${esc(jtVal)}" placeholder="공고명 입력..." oninput="saveJT(this.value)" onchange="saveJT(this.value)">`;
    // 내부 ID 표시 + 변경 버튼 (표시명과 키 분리 명시)
    h += `<div style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:#888">`;
    h += `<span>ID:</span>`;
    h += `<code style="background:#f4f4f5;padding:2px 6px;border-radius:4px;font-family:monospace;color:#555;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(curPos)}">${esc(curPos)}</code>`;
    h += `<button class="btn btn-sm" onclick="openRenameModal()" style="font-size:10px;padding:2px 8px" title="Supabase 키와 모든 자식 데이터를 함께 변경">🔑 ID 변경</button>`;
    h += `</div>`;
    h += `</div>`;

    // 게시 현황 (공고명 바로 아래, 한줄)
    if(!D.postedPlatforms) D.postedPlatforms = {};
    if(!D.postedPlatforms[curPos]) D.postedPlatforms[curPos] = {};
    const posted = D.postedPlatforms[curPos];
    const visiblePlts = D.platforms.filter(p=>!p.hidden);
    h += `<div class="field" style="margin-bottom:10px"><label style="margin-bottom:2px">📎 게시 현황</label>`;
    h += `<div style="display:flex;flex-wrap:wrap;gap:4px 12px">`;
    visiblePlts.forEach(plt=>{
      const ck2 = posted[plt.id] ? 'checked' : '';
      h += `<label style="font-size:11px;color:#666;cursor:pointer;display:inline-flex;align-items:center;gap:3px;white-space:nowrap"><input type="checkbox" class="posted-check" ${ck2} onchange="togglePosted('${plt.id}',this.checked)" style="margin:0;cursor:pointer">${esc(plt.name)}</label>`;
    });
    h += `</div></div>`;

    // 메타필드 카드 (자동화 옵션) — positions.metadata JSONB 동기화
    h += renderMetadataCard();

    const ck = getCommonKey(curPos);
    const pdk = getPosDataKey(curPos);
    const clLabel = (D.posLang[curPos]||'ko').toUpperCase();
    D.sections.forEach(sec=>{
      const cv = (D.data[ck]||{})[sec.key] || '';
      const pv = sec.commonOnly ? null : ((D.data[pdk]||{})[sec.key] || '');

      h += `<div class="field"><label>${esc(sec.name)} ${sec.commonOnly?'<span class="tag tag-b">공통 '+clLabel+'</span>':'<span class="tag tag-g">포지션별</span>'}</label>`;

      if(sec.commonOnly){
        if(cv){
          h += `<div style="font-size:12px;color:#888;background:#f9f9f9;border:1px solid #eee;border-radius:6px;padding:8px;max-height:100px;overflow-y:auto;white-space:pre-wrap;line-height:1.6">${esc(cv.length>200?cv.slice(0,200)+'...':cv)}</div>`;
        } else {
          h += `<span style="font-size:11px;color:#ccc">—</span>`;
        }
      } else {
        if(cv) {
          h += `<details style="margin-bottom:4px"><summary style="font-size:11px;color:#999;cursor:pointer">공통 ${clLabel} 내용 보기</summary>`;
          h += `<div style="font-size:12px;color:#888;background:#f9f9f9;border:1px solid #eee;border-radius:6px;padding:8px;margin-top:4px;white-space:pre-wrap;line-height:1.6;max-height:120px;overflow-y:auto">${esc(cv)}</div></details>`;
        }
        h += `<textarea data-t="p" data-k="${sec.key}" rows="${Math.max(3,(pv||'').split('\n').length)}" placeholder="포지션별 내용 입력...">${esc(pv||'')}</textarea>`;
      }
      h += '</div>';
    });

  }

  $('editor').innerHTML = h;

  // Bind input events
  $('editor').querySelectorAll('textarea').forEach(ta=>{
    ta.addEventListener('input', function(){
      const type = this.dataset.t;
      const key = this.dataset.k;
      if(type==='c'){
        if(!D.data[commonDataKey]) D.data[commonDataKey]={};
        D.data[commonDataKey][key] = this.value;
      } else {
        const _pdk = getPosDataKey(curPos);
        if(!D.data[_pdk]) D.data[_pdk]={};
        D.data[_pdk][key] = this.value;
      }
      save();
      renderPreview();
    });
  });
}

function renderPreview(){
  const plt = D.platforms.find(p=>p.id===curPlt);
  if(!plt){ $('preview').innerHTML=''; return; }
  if(curPos==='__common__'){
    $('preview').innerHTML='<p style="color:#999;font-size:13px">포지션을 선택하면 플랫폼별 미리보기가 표시됩니다.</p>';
    return;
  }

  // 플랫폼 설명 + 동일형식 안내
  let descH = '';
  const sameType = D.platforms.filter(p=>p.type===plt.type && p.id!==plt.id);
  const descText = (plt.desc||'') + (sameType.length ? ' [같은 형식: '+sameType.map(p=>p.name).join(', ')+']' : '');
  if(descText.trim()) descH += `<div class="plt-desc">${esc(descText)}</div>`;

  if(plt.type==='separate') renderSeparate(plt);
  else if(plt.type==='html') renderHtmlPreview(plt);
  else if(plt.type==='fullhtml') renderFullHtml(plt);
  else renderSingle(plt);

  // 공고명 + 플랫폼 설명을 preview 앞에 삽입
  $('preview').innerHTML = descH + jtSecHtml() + $('preview').innerHTML;
}

function renderSeparate(plt){
  // separate 타입에 fields가 없으면 기본 생성
  const fields = plt.fields || D.sections.map(s=>({l:s.name, s:[s.key]}));
  let h = '';
  fields.forEach(f=>{
    const parts = f.s.map(sk=>{
      const v = getVal(sk);
      if(!v) return '';
      if(f.s.length > 1) return '['+secName(sk)+']\n'+bullets(v, plt.b);
      return bullets(v, plt.b);
    }).filter(Boolean);
    const text = parts.join(nlRepeat(LB.within));
    const id = 'cp_'+plt.id+'_'+f.l.replace(/[^a-zA-Z0-9가-힣]/g,'');

    const secNames = f.s.map(sk=>secName(sk)).join(' + ');
    h += `<div class="cp-sec"><div class="cp-h"><span>${esc(f.l)}</span><span class="cp-field-hint">${esc(secNames)}</span>`;
    h += `<button class="btn btn-sm btn-b" onclick="copySepField('${plt.id}','${f.s.join(',')}');toast('복사됨')">복사</button></div>`;
    h += `<div class="cp-body" id="${id}">${esc(text)||'(내용 없음)'}</div></div>`;
  });
  $('preview').innerHTML = h;
}

function renderSingle(plt){
  const full = D.sections.map(s=>{
    const v=getVal(s.key); if(!v) return '';
    return '['+s.name+']\n'+bullets(v, plt.b);
  }).filter(Boolean).join(nlRepeat(LB.between));

  let h = '<div style="margin-bottom:8px;display:flex;gap:4px;flex-wrap:wrap">';
  h += `<button class="btn btn-sm btn-b" onclick="copyFull('${plt.id}')">전체 복사</button>`;
  D.sections.forEach(s=>{ if(getVal(s.key)) h+=`<button class="btn btn-sm" onclick="copySec('${s.key}','${plt.id}')">${esc(s.name)}</button>`; });
  h += '</div>';
  h += `<div class="pv-box">${esc(full)}</div>`;
  $('preview').innerHTML = h;
}

function renderHtmlPreview(plt){
  const htmlStr = D.sections.map(s=>{
    const v=getVal(s.key); if(!v) return '';
    return toHtml(v, s.name);
  }).filter(Boolean).join(brRepeat(LB.between));

  let h = '<div style="margin-bottom:8px;display:flex;gap:4px;flex-wrap:wrap">';
  h += `<button class="btn btn-sm btn-b" onclick="copyRichHtml()">📋 붙여넣기용 복사</button>`;
  h += `<button class="btn btn-sm btn-g" onclick="copyHtmlAll()">HTML 소스 복사</button>`;
  h += `<button class="btn btn-sm" onclick="copyFull('${plt.id}')">텍스트 복사</button>`;
  h += '</div>';
  h += `<div class="pv-box pv-html">${htmlStr}</div>`;
  $('preview').innerHTML = h;
}

// fullhtml은 html과 동일 렌더링 (자체페이지 제거 후 그리팅 전용)
function renderFullHtml(plt){
  renderHtmlPreview(plt);
}

// ── Copy Functions ──
function copyFull(pltId){
  const plt = D.platforms.find(p=>p.id===pltId);
  const t = D.sections.map(s=>{
    const v=getVal(s.key); if(!v) return '';
    return '['+s.name+']\n'+bullets(v, plt.b);
  }).filter(Boolean).join(nlRepeat(LB.between));
  clip(t); toast('전체 텍스트 복사됨');
}

function copySec(secKey, pltId){
  const plt = D.platforms.find(p=>p.id===pltId);
  clip(bullets(getVal(secKey), plt.b));
  toast(secName(secKey)+' 복사됨');
}

// separate 타입 필드 단위 복사 (여러 섹션이 하나의 필드에 합쳐진 경우)
function copySepField(pltId, secKeysStr){
  const plt = D.platforms.find(p=>p.id===pltId);
  if(!plt) return;
  const keys = secKeysStr.split(',');
  const parts = keys.map(sk=>{
    const v = getVal(sk);
    if(!v) return '';
    if(keys.length > 1) return '['+secName(sk)+']\n'+bullets(v, plt.b);
    return bullets(v, plt.b);
  }).filter(Boolean);
  const text = parts.join(nlRepeat(LB.within));
  clip(text);
}

function copyHtmlAll(){
  const h = D.sections.map(s=>{
    const v=getVal(s.key); if(!v) return '';
    return toHtml(v, s.name);
  }).filter(Boolean).join('\n'+brRepeat(LB.between)+'\n');
  clip(h); toast('HTML 복사됨');
}

// 리치 HTML 복사 — ATS(그리팅 Quill 등) 에디터 붙여넣기용
// Quill 1.3.6 호환: 태그 사이 \n(공백 텍스트 노드)를 모두 제거해야 빈 단락 삽입 방지
// Quill은 블록 요소 사이의 \n을 별도 단락으로 파싱함
function copyRichHtml(){
  let h = '<h2>'+ esc(curPos) +'</h2>';
  const parts=[]; D.sections.forEach(s=>{ const v=getVal(s.key); if(v) parts.push(toHtml(v, s.name, true)); });
  h += parts.join('');
  // 태그 사이 공백/줄바꿈 제거 → Quill이 빈 단락을 추가로 생성하지 않음
  h = h.replace(/>\s+</g, '><');
  clipHtml(h);
  toast('붙여넣기용 복사 완료 — Ctrl+V');
}

// copyFullPage, openPreview 제거됨 (자체페이지 기능 폐기, fullhtml→html 통합)

// buildBridgePayload/sendToBridge(📤 매크로로 전송) 제거됨 —
// 클립보드 payload 채널은 userscript v0.1.0~0.3.0 시절 설계. 현행 확장·userscript는
// 모두 Supabase에서 직접 fetch하므로 읽는 쪽이 없는 죽은 기능이었음 (v0.8.0에서 정리).

function copyJT(){
  clip(getJT());
  toast('공고명 복사됨');
}

function getJT(){
  if(!D.jobTitles) D.jobTitles = {};
  return D.jobTitles[curPos] || curPos;
}

function jtSecHtml(){
  if(!curPos || curPos==='__common__') return '';
  if(!D.jobTitles) D.jobTitles = {};
  const val = D.jobTitles[curPos] || curPos;
  return `<div class="cp-sec jt-sec"><div class="cp-h"><span>공고명</span><span id="jtDisplay" style="flex:1;margin:0 8px;font-size:12px;font-weight:600;color:#333">${esc(val)}</span><button class="btn btn-sm btn-b" onclick="copyJT()">복사</button></div></div>`;
}

function setPosLang(lang){
  if(!D.posLang) D.posLang = {};
  D.posLang[curPos] = lang;
  // 언어 전환 시 해당 언어 데이터 키가 없으면 빈 객체 생성
  const pdk = getPosDataKey(curPos);
  if(!D.data[pdk]) D.data[pdk] = {};
  save();
  render();
}

function setPosStatus(val){
  if(!D.posStatus) D.posStatus = {};
  D.posStatus[curPos] = val;
  save();
  // 탭 상태 태그 즉시 반영
  render();
}

function togglePosted(pltId, checked){
  if(!D.postedPlatforms) D.postedPlatforms = {};
  if(!D.postedPlatforms[curPos]) D.postedPlatforms[curPos] = {};
  D.postedPlatforms[curPos][pltId] = checked;
  save();
}

// ══════════════════════════════════════
// ── Metadata Card (positions.metadata JSONB) ──
// 7개 메타 키: job_categories(태그 array, max 3), employment_type(radio),
//   career_type(radio), career_min/max(int), salary_min/max(int nullable),
//   deadline_type(radio) + deadline_date(ISO date nullable), location(text),
//   extras(checkbox: 병역특례·외국어우대·외국인지원·장애인우대)
// Supabase positions.metadata JSONB 컬럼과 1:1 매핑
// ══════════════════════════════════════
function _getMeta(){
  if(!D.metadata) D.metadata = {};
  if(!D.metadata[curPos]) D.metadata[curPos] = {};
  return D.metadata[curPos];
}

function renderMetadataCard(){
  if(!curPos || curPos==='__common__') return '';
  const m = _getMeta();
  const cats = Array.isArray(m.job_categories) ? m.job_categories : [];
  const empType = m.employment_type || '';
  const carType = m.career_type || '';
  const carMin = (m.career_min ?? '');
  const carMax = (m.career_max ?? '');
  const salMin = (m.salary_min ?? '');
  const salMax = (m.salary_max ?? '');
  const dlType = m.deadline_type || 'always';
  const dlDate = m.deadline_date || '';
  const loc = m.location || '';
  const ex = m.extras || {};
  const opened = m._opened ? ' open' : '';

  let h = '';
  h += `<details class="meta-card"${opened} ontoggle="setMeta('_opened', this.open)" style="margin-bottom:10px;border:1px solid #e4e7ec;border-radius:8px;padding:8px 10px;background:#fafbfc">`;
  h += `<summary style="cursor:pointer;font-size:12px;font-weight:600;color:#344054;user-select:none">⚙️ 메타 필드 (자동화 옵션)</summary>`;
  h += `<div style="margin-top:10px;display:flex;flex-direction:column;gap:10px;font-size:12px">`;

  // 1) 직군·직무 태그 (최대 3개)
  h += `<div><label style="display:block;font-size:11px;color:#344054;margin-bottom:4px">직군·직무 (최대 3개)</label>`;
  h += `<div id="metaCatTags" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px">`;
  cats.forEach((c, i) => {
    h += `<span style="display:inline-flex;align-items:center;gap:3px;background:#eff6ff;color:#155eef;padding:2px 6px;border-radius:10px;font-size:11px">${esc(c)}<button onclick="removeJobCategory(${i})" style="background:none;border:0;color:#155eef;cursor:pointer;padding:0;font-size:13px;line-height:1" title="삭제">×</button></span>`;
  });
  h += `</div>`;
  if(cats.length < 3){
    h += `<input type="text" placeholder="예: 백엔드 개발 (Enter)" onkeydown="if(event.key==='Enter'){event.preventDefault();addJobCategory(this.value);this.value='';}" style="width:100%;padding:4px 6px;border:1px solid #d0d5dd;border-radius:6px;font-size:12px">`;
  } else {
    h += `<span style="font-size:11px;color:#888">최대 3개까지 등록 가능</span>`;
  }
  h += `</div>`;

  // 2) 고용형태
  h += `<div><label style="display:block;font-size:11px;color:#344054;margin-bottom:4px">고용형태</label><div style="display:flex;gap:10px;flex-wrap:wrap">`;
  [['regular','정규직'],['contract','계약직'],['intern','인턴']].forEach(([v,l])=>{
    h += `<label style="display:inline-flex;align-items:center;gap:3px;cursor:pointer"><input type="radio" name="meta_emp" value="${v}" ${empType===v?'checked':''} onchange="setMeta('employment_type','${v}')" style="margin:0">${l}</label>`;
  });
  h += `</div></div>`;

  // 3) 경력 유형
  h += `<div><label style="display:block;font-size:11px;color:#344054;margin-bottom:4px">경력 유형</label><div style="display:flex;gap:10px;flex-wrap:wrap">`;
  [['entry','신입'],['experienced','경력']].forEach(([v,l])=>{

function setMeta(key, value){
  if(!D.metadata) D.metadata = {};
  if(!D.metadata[curPos]) D.metadata[curPos] = {};
  D.metadata[curPos][key] = value;
  save();
  // 마감일 라디오 변경 시 date input enabled/disabled 즉시 반영을 위해 메타 카드만 다시 렌더
  if(key === 'deadline_type'){
    // 카드 일부만 새로 그리는 가벼운 방법: renderEditor() 재호출
    // _opened 상태는 setMeta('_opened') 핸들러로 보존됨
    if(!D.metadata[curPos]._opened) D.metadata[curPos]._opened = true;
    renderEditor();
  }
}

function setMetaExtra(key, checked){
  if(!D.metadata) D.metadata = {};
  if(!D.metadata[curPos]) D.metadata[curPos] = {};
  if(!D.metadata[curPos].extras) D.metadata[curPos].extras = {};
  D.metadata[curPos].extras[key] = checked;
  save();
}

function addJobCategory(text){
  text = (text||'').trim();
  if(!text) return;

  if(!D.metadata[curPos]) D.metadata[curPos] = {};
  if(!Array.isArray(D.metadata[curPos].job_categories)) D.metadata[curPos].job_categories = [];
  if(D.metadata[curPos].job_categories.length >= 3){ toast('직군은 최대 3개'); return; }
  if(D.metadata[curPos].job_categories.includes(text)){ toast('이미 추가된 직군'); return; }
  D.metadata[curPos].job_categories.push(text);
  if(!D.metadata[curPos]._opened) D.metadata[curPos]._opened = true;
  save();
  renderEditor();
}

function removeJobCategory(idx){
  if(!D.metadata || !D.metadata[curPos] || !Array.isArray(D.metadata[curPos].job_categories)) return;
  D.metadata[curPos].job_categories.splice(idx, 1);
  if(!D.metadata[curPos]._opened) D.metadata[curPos]._opened = true;

function setCommonLang(lang){

  render();
}

function saveJT(v){
  if(!D.jobTitles) D.jobTitles = {};
  D.jobTitles[curPos] = v;
  save();
  // 미리보기 공고명 동기화

  if(disp) disp.textContent = v || curPos;
  // 포지션 탭 버튼 동기화 — innerHTML로 langTag 보존
  const tabs = $('posTabs').querySelectorAll('.tab');
  tabs.forEach(tab=>{

      const stTag = st !== 'draft' ? `<span class="status-tag status-${st}">${st==='active'?'Active':'Closed'}</span>` : '';
      tab.innerHTML = esc(v || curPos) + langTag + stTag;
    }
  });
}

// ── Batch Copy (클릭마다 한 칸씩) ──
let BC = { cells:[], labels:[], idx:0, rev:false };

function buildBatchCells(){
  const plt = D.platforms.find(p=>p.id===curPlt);
  if(!plt || !curPos || curPos==='__common__') return;
  let cells = [], labels = [];
  cells.push(getJT()); labels.push('공고명');
  if(plt.type==='separate' && plt.fields){
    plt.fields.forEach(f=>{
      const parts = f.s.map(sk=>{
        const v = getVal(sk);
        if(!v) return '';
        if(f.s.length > 1) return '['+secName(sk)+']\n'+bullets(v, plt.b);
        return bullets(v, plt.b);
      }).filter(Boolean);
      if(parts.length){ cells.push(parts.join(nlRepeat(LB.within))); labels.push(f.l); }
    });
  } else {
    D.sections.forEach(s=>{
      const v = getVal(s.key);
      if(!v) return;
      cells.push('['+s.name+']\n'+bullets(v, plt.b)); labels.push(s.name);
    });
  }
  BC.cells = cells; BC.labels = labels; BC.idx = 0;
  updateBatchBtn();
}

function updateBatchBtn(){
  const btn = $('batchBtn');
  if(!btn) return;
  if(!BC.cells.length){ btn.textContent = '일괄복사'; return; }
  if(BC.idx >= BC.cells.length){
    btn.textContent = '✓ 완료 (클릭=처음부터)';
    btn.classList.remove('btn-b'); btn.classList.add('btn-g');
    return;
  }
  btn.classList.remove('btn-g'); btn.classList.add('btn-b');
  btn.textContent = (BC.rev?'▲':'▼') + ' ' + BC.labels[BC.idx] + ' (' + (BC.idx+1) + '/' + BC.cells.length + ')';
}

function batchStep(){
  if(!curPos || curPos==='__common__'){ toast('포지션을 선택하세요'); return; }
  // 첫 클릭 또는 완료 후 재시작 시 셀 빌드
  if(!BC.cells.length || BC.idx >= BC.cells.length){
    if(BC.idx >= BC.cells.length && BC.cells.length > 0){ BC.idx = 0; updateBatchBtn(); return; }
    buildBatchCells();
    if(!BC.cells.length){ toast('복사할 내용이 없습니다'); return; }
    return; // 첫 클릭은 준비만 (다음 클릭부터 복사)
  }
  clip(BC.cells[BC.idx]);
  toast(BC.labels[BC.idx] + ' 복사됨 (' + (BC.idx+1) + '/' + BC.cells.length + ')');
  BC.idx++;
  updateBatchBtn();
}

function batchReverse(){
  if(!BC.cells.length){ buildBatchCells(); }
  BC.rev = !BC.rev;
  BC.cells.reverse(); BC.labels.reverse();
  BC.idx = 0;
  updateBatchBtn();
  toast(BC.rev ? '역순으로 변경' : '순차로 변경');
}

function batchReset(){
  buildBatchCells();
  toast('일괄복사 초기화');
}

// ── Position Management ──
function addPosition(){
  const name = prompt('새 포지션 이름:');
  if(!name || !name.trim()) return;
  const n = name.trim();
  D.positions.push(n);
  D.data[n] = {};
  // 기본 언어: KO (편집기에서 변경 가능)
  if(!D.posLang) D.posLang = {};
  D.posLang[n] = 'ko';
  // metadata 초기화 (positions.metadata JSONB)
  if(!D.metadata) D.metadata = {};
  D.metadata[n] = {};
  curPos = n;
  save(); render();
}

function duplicatePosition(){
  if(!curPos || curPos==='__common__'){ toast('복사할 포지션을 선택하세요'); return; }
  let newName = curPos + ' (복사)';
  let i = 2;
  while(D.positions.includes(newName)){ newName = curPos + ' (복사'+i+')'; i++; }
  D.positions.push(newName);
  // KO 데이터 복사
  D.data[newName] = JSON.parse(JSON.stringify(D.data[curPos] || {}));
  // EN 데이터 복사
  if(D.data[curPos+'__en']) D.data[newName+'__en'] = JSON.parse(JSON.stringify(D.data[curPos+'__en']));
  if(!D.jobTitles) D.jobTitles = {};
  // 표시명은 newName(키) 그대로 노출 — 키에 이미 ' (복사)' 가 있으므로 중복 suffix 회피
  // 사용자가 표시명을 바꾸고 싶으면 [공고명] 입력란에서 수정, 키 자체를 바꾸려면 [🔑 ID 변경] 사용
  D.jobTitles[newName] = newName;
  if(!D.posLang) D.posLang = {};
  if(D.posLang[curPos]) D.posLang[newName] = D.posLang[curPos]; // 언어 태그 복사
  if(!D.posStatus) D.posStatus = {};
  if(D.posStatus[curPos]) D.posStatus[newName] = D.posStatus[curPos];
  if(!D.postedPlatforms) D.postedPlatforms = {};
  if(D.postedPlatforms[curPos]) D.postedPlatforms[newName] = JSON.parse(JSON.stringify(D.postedPlatforms[curPos]));
  if(!D.metadata) D.metadata = {};
  D.metadata[newName] = D.metadata[curPos] ? JSON.parse(JSON.stringify(D.metadata[curPos])) : {};
  curPos = newName;
  save(); render();
}

function removePosition(){
  if(!curPos || curPos==='__common__') return;
  if(!confirm(curPos+' 포지션을 삭제하시겠습니까?')) return;
  const removed = curPos;
  D.positions = D.positions.filter(p=>p!==removed);
  delete D.data[removed];
  delete D.data[removed+'__en']; // EN 데이터도 삭제
  if(D.jobTitles) delete D.jobTitles[removed];
  if(D.posLang) delete D.posLang[removed];
  if(D.posStatus) delete D.posStatus[removed];
  if(D.postedPlatforms) delete D.postedPlatforms[removed];
  if(D.metadata) delete D.metadata[removed];
  if(D.archivedOrigOrder) delete D.archivedOrigOrder[removed];
  curPos = D.positions[0] || '';
  save(); render();
}

// ── 키 변경 (Cascade Rename) ──
// Supabase FK는 ON UPDATE CASCADE 적용됨 (2026-04-28 마이그레이션)
// 따라서 positions.name UPDATE 한 번으로 자식 테이블 자동 갱신
// 로컬 D 객체의 모든 키도 동시 마이그레이션
// ══════════════════════════════════════
async function renamePositionKey(oldName, newName){
  if(!oldName || oldName==='__common__'){ toast('변경할 포지션을 선택하세요'); return false; }
  newName = (newName||'').trim();
  if(!newName){ toast('새 ID를 입력하세요'); return false; }
  if(newName === oldName) return false;
  if(D.positions.includes(newName) || (D.archived||[]).includes(newName)){
    toast('이미 존재하는 ID입니다');
    return false;
  }

  // 1) 안전 백업 (클라우드 연결 시)
  if(_sb){
    try { await takeCloudSnapshot('Rename 전 ' + oldName, false); } catch(e){ console.warn(e); }
  }

  // 2) Supabase positions.name UPDATE (FK ON UPDATE CASCADE → 자식 자동 갱신)
  if(_sb){
    try {
      const { error } = await _sb.from('positions').update({ name: newName, updated_at: new Date().toISOString() }).eq('name', oldName);
      if(error) throw error;
    } catch(e){
      console.error('Rename 실패:', e);
      toast('Supabase rename 실패: ' + (e.message||e));
      return false;
    }
  }

  // 3) 로컬 D 객체 키 일괄 마이그레이션
  const idx = D.positions.indexOf(oldName);
  if(idx >= 0) D.positions[idx] = newName;
  // 보관 목록에 있을 경우도 처리
  if(D.archived){
    const aIdx = D.archived.indexOf(oldName);
    if(aIdx >= 0) D.archived[aIdx] = newName;
  }
  // data (KO + EN)
  if(D.data[oldName] !== undefined){ D.data[newName] = D.data[oldName]; delete D.data[oldName]; }
  if(D.data[oldName+'__en'] !== undefined){ D.data[newName+'__en'] = D.data[oldName+'__en']; delete D.data[oldName+'__en']; }
  // jobTitles
  if(D.jobTitles && D.jobTitles[oldName] !== undefined){
    D.jobTitles[newName] = D.jobTitles[oldName];
    delete D.jobTitles[oldName];
  }
  // posLang
  if(D.posLang && D.posLang[oldName] !== undefined){
    D.posLang[newName] = D.posLang[oldName];
    delete D.posLang[oldName];
  }
  // posStatus
  if(D.posStatus && D.posStatus[oldName] !== undefined){
    D.posStatus[newName] = D.posStatus[oldName];
    delete D.posStatus[oldName];
  }
  // postedPlatforms
  if(D.postedPlatforms && D.postedPlatforms[oldName] !== undefined){
    D.postedPlatforms[newName] = D.postedPlatforms[oldName];
    delete D.postedPlatforms[oldName];
  }
  // metadata (positions.metadata JSONB)
  if(D.metadata && D.metadata[oldName] !== undefined){
    D.metadata[newName] = D.metadata[oldName];
    delete D.metadata[oldName];
  }
  // archivedOrigOrder (보관 정렬 정보)
  if(D.archivedOrigOrder && D.archivedOrigOrder[oldName] !== undefined){
    D.archivedOrigOrder[newName] = D.archivedOrigOrder[oldName];
    delete D.archivedOrigOrder[oldName];
  }

  if(curPos === oldName) curPos = newName;
  save(); render();

  // 4) 클라우드 연결 시 config.archived 갱신을 위해 push
  if(_sb){
    setTimeout(()=> _sbPush().then(()=> toast('ID 변경 + 동기화 완료')), 100);
  } else {
    toast('ID 변경 완료 (로컬)');
  }
  logActivity('rename', 'info', `${oldName} → ${newName}`, { cloud: !!_sb });
  return true;
}

// ID 변경 모달 (UX 강화: dirty 감지, Enter 단축키, 자동저장 confirm)
let _renameOriginal = null; // 모달 진입 시점의 원본 ID

// 모든 닫기 경로 (헤더X, 취소, 배경클릭, ESC)에서 dirty 체크
async function tryCloseRename(){
  const inp = document.getElementById('renameInput');
  if(!inp || _renameOriginal === null){ closeModal(); return; }
  const cur = inp.value.trim();
  if(cur === _renameOriginal || !cur){
    // 변경 없음 또는 빈 값 → 그냥 닫기
    _renameOriginal = null;
    closeModal();
    return;
  }
  // dirty: 사용자에게 확인
  const ok = confirm(
    `입력한 새 ID:\n  ${cur}\n\n저장하시겠습니까?\n\n[확인] 저장 후 닫기\n[취소] 변경 사항 버리고 닫기`
  );
  if(ok){
    const success = await renamePositionKey(_renameOriginal, cur);
    if(!success) return; // 실패 시 모달 유지하여 재시도 가능
  }
  _renameOriginal = null;
  closeModal();
}

// 변경 + 닫기 (저장 버튼 / Enter 키)
async function commitRename(){
  const inp = document.getElementById('renameInput');
  if(!inp) return;
  const cur = inp.value.trim();
  if(!cur || cur === _renameOriginal){ closeModal(); _renameOriginal = null; return; }
  const ok = await renamePositionKey(_renameOriginal, cur);
  if(ok){ _renameOriginal = null; closeModal(); }
}

function openSectionMgr(){
  let h = '<div class="modal-bg" onclick="if(event.target===this)closeModal()">';
  h += '<div class="modal">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">';
  h += '<h2>⚙️ 섹션 관리</h2>';
  h += '<button class="btn btn-sm" onclick="closeModal()">닫기</button>';
  h += '</div>';
  h += '<p style="font-size:12px;color:#888;margin-bottom:12px">섹션의 추가/삭제/이름변경/순서변경/공통여부를 설정합니다.</p>';

  h += '<div id="secList">';
  h += renderSecList();
  h += '</div>';

  h += '<div style="margin-top:12px;display:flex;gap:6px">';
  h += '<button class="btn btn-sm btn-b" onclick="addSection()">+ 섹션 추가</button>';
  h += '<button class="btn btn-sm btn-g" onclick="resetSections()">기본값 복원</button>';
  h += '</div>';

  h += '</div></div>';
  $('modalRoot').innerHTML = h;
  initSecDrag();
}

function renderSecList(){
  let h = '';
  D.sections.forEach((sec, i)=>{
    h += `<div class="sec-row" draggable="true" data-idx="${i}">`;
    h += `<span class="drag-handle" title="드래그하여 순서 변경">⠿</span>`;
    h += `<span class="sec-name">${esc(sec.name)}</span>`;
    h += `<span class="sec-key">(${sec.key})</span>`;
    // 공통 여부
    h += `<select onchange="toggleCommon(${i},this.value)">`;
    h += `<option value="false" ${!sec.commonOnly?'selected':''}>포지션별</option>`;
    h += `<option value="true" ${sec.commonOnly?'selected':''}>공통만</option>`;
    h += '</select>';
    // 이름 변경
    h += `<button class="btn btn-sm" onclick="renameSection(${i})">이름변경</button>`;
    // 삭제
    h += `<button class="btn btn-sm btn-r" onclick="deleteSection(${i})">삭제</button>`;
    h += '</div>';
  });
  return h;
}

function addSection(){
  const name = prompt('새 섹션 이름:');
  if(!name || !name.trim()) return;
  const key = genKey(name.trim());
  D.sections.push({key, name:name.trim(), commonOnly:false});
  save();
  $('secList').innerHTML = renderSecList(); initSecDrag();
  render();
}

function deleteSection(i){
  const sec = D.sections[i];
  if(!confirm(`"${sec.name}" 섹션을 삭제하시겠습니까?\n(해당 섹션의 모든 데이터도 삭제됩니다)`)) return;
  D.sections.splice(i, 1);
  // 데이터에서도 제거 (KO/EN 모두)
  Object.keys(D.data).forEach(dk=>{
    if(D.data[dk] && D.data[dk][sec.key]) delete D.data[dk][sec.key];
  });
  // 플랫폼 fields에서도 제거
  D.platforms.forEach(plt=>{
    if(plt.fields){
      plt.fields.forEach(f=>{ f.s = f.s.filter(sk=>sk!==sec.key); });
      plt.fields = plt.fields.filter(f=>f.s.length > 0);
    }
  });
  save();
  $('secList').innerHTML = renderSecList(); initSecDrag();
  render();
}

function renameSection(i){
  const sec = D.sections[i];
  const name = prompt('새 이름:', sec.name);
  if(!name || !name.trim() || name.trim()===sec.name) return;
  sec.name = name.trim();
  save();
  $('secList').innerHTML = renderSecList(); initSecDrag();
  render();
}

function moveSection(i, dir){
  const j = i + dir;
  if(j < 0 || j >= D.sections.length) return;
  [D.sections[i], D.sections[j]] = [D.sections[j], D.sections[i]];
  save();
  $('secList').innerHTML = renderSecList(); initSecDrag();
  render();
}

function toggleCommon(i, val){
  D.sections[i].commonOnly = val === 'true';
  save();
  render();
}

// ── 섹션 드래그 앤 드롭 ──
function initSecDrag(){
  const wrap = $('secList');
  if(!wrap) return;
  let dragIdx = -1;
  const rows = wrap.querySelectorAll('.sec-row[draggable]');
  rows.forEach(row=>{
    row.addEventListener('dragstart', e=>{
      if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)){ e.preventDefault(); return; }
      dragIdx = +row.dataset.idx;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', ()=>{
      row.classList.remove('dragging');
      wrap.querySelectorAll('.sec-row').forEach(r=>r.classList.remove('drag-over'));
    });
    row.addEventListener('dragover', e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      wrap.querySelectorAll('.sec-row').forEach(r=>r.classList.remove('drag-over'));
      if(+row.dataset.idx !== dragIdx) row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', ()=> row.classList.remove('drag-over'));
    row.addEventListener('drop', e=>{
      e.preventDefault();
      const targetIdx = +row.dataset.idx;
      if(targetIdx === dragIdx || dragIdx < 0) return;
      const item = D.sections.splice(dragIdx, 1)[0];
      D.sections.splice(targetIdx, 0, item);
      save();
      $('secList').innerHTML = renderSecList(); initSecDrag();
      render();
    });
  });
}

function resetSections(){
  if(!confirm('섹션을 기본값으로 복원하시겠습니까?')) return;
  D.sections = JSON.parse(JSON.stringify(DEFAULT_SECTIONS));
  save();
  $('secList').innerHTML = renderSecList(); initSecDrag();
  render();
}

function _pi(id){ return D.platforms.findIndex(p=>p.id===id); }

    if(plt.type === 'separate' && plt.fields){
      h += `<div class="pf-field-list" data-pid="${esc(pid)}">`;
      plt.fields.forEach((f, fi)=>{
        h += `<div class="pf-row" draggable="true" data-fi="${fi}">`;
        h += `<span class="drag-handle" style="font-size:13px" title="드래그하여 순서 변경">⠿</span>`;
        h += `<input class="pf-label" style="border:1px solid #ddd;border-radius:4px;padding:2px 6px;font-size:12px;width:120px" value="${esc(f.l)}" onchange="renamePltField(_pi('${pid}'),${fi},this.value)">`;

// ── 플랫폼 카드 드래그 앤 드롭 ──
function initPltDrag(){
  const wrap = $('pltConfig');
  if(!wrap) return;
  let dragId = null;
  const cards = wrap.querySelectorAll('.plt-card[draggable]');
  cards.forEach(card=>{
    card.addEventListener('dragstart', e=>{
      if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)){ e.preventDefault(); return; }
      dragId = card.dataset.pid;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragId);
    });
    card.addEventListener('dragend', ()=>{
      dragId = null;
      card.classList.remove('dragging');
      wrap.querySelectorAll('.plt-card').forEach(c=>c.classList.remove('drag-over'));
    });
    card.addEventListener('dragover', e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      wrap.querySelectorAll('.plt-card').forEach(c=>c.classList.remove('drag-over'));
      if(card.dataset.pid !== dragId) card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', ()=> card.classList.remove('drag-over'));
    card.addEventListener('drop', e=>{
      e.preventDefault();
      const targetId = card.dataset.pid;
      if(!dragId || targetId === dragId) return;
      const fromIdx = D.platforms.findIndex(p=>p.id===dragId);
      const toIdx = D.platforms.findIndex(p=>p.id===targetId);
      if(fromIdx < 0 || toIdx < 0) return;
      const item = D.platforms.splice(fromIdx, 1)[0];
      D.platforms.splice(toIdx, 0, item);
      dragId = null;
      save();
      $('pltConfig').innerHTML = renderPlatformConfig();
      initPltDrag();
      render();
    });
  });
  // 필드 행 드래그
  wrap.querySelectorAll('.pf-field-list').forEach(list=>{
    const pltId = list.dataset.pid;
    let dragFi = -1;
    const rows = list.querySelectorAll('.pf-row[draggable]');
    rows.forEach(row=>{
      row.addEventListener('dragstart', e=>{
        if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)){ e.preventDefault(); return; }
        e.stopPropagation();
        dragFi = +row.dataset.fi;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', 'field');
      });
      row.addEventListener('dragend', ()=>{
        row.classList.remove('dragging');
        list.querySelectorAll('.pf-row').forEach(r=>r.classList.remove('drag-over'));
      });
      row.addEventListener('dragover', e=>{
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        list.querySelectorAll('.pf-row').forEach(r=>r.classList.remove('drag-over'));
        if(+row.dataset.fi !== dragFi) row.classList.add('drag-over');
      });
      row.addEventListener('dragleave', ()=> row.classList.remove('drag-over'));
      row.addEventListener('drop', e=>{
        e.preventDefault();
        e.stopPropagation();
        const targetFi = +row.dataset.fi;
        if(targetFi === dragFi || dragFi < 0) return;
        const pi = D.platforms.findIndex(p=>p.id===pltId);
        if(pi < 0) return;
        const fields = D.platforms[pi].fields;
        const item = fields.splice(dragFi, 1)[0];
        fields.splice(targetFi, 0, item);
        dragFi = -1;
        save();
        $('pltConfig').innerHTML = renderPlatformConfig();
        initPltDrag();
        renderPreview();
      });
    });
  });
}

function togglePltSec(pi, fi, secKey){
  const f = D.platforms[pi].fields[fi];
  const idx = f.s.indexOf(secKey);
  if(idx >= 0) f.s.splice(idx, 1);
  else f.s.push(secKey);

}

function renamePltField(pi, fi, val){

function addPltField(pi){

  if(!name || !name.trim()) return;
  D.platforms[pi].fields.push({l:name.trim(), s:[]});
  save();

}

function removePltField(pi, fi){

  save();
  $('pltConfig').innerHTML = renderPlatformConfig(); initPltDrag();
  renderPreview();
}

function movePltField(pi, fi, dir){

  const j = fi + dir;
  if(j < 0 || j >= fields.length) return;
  [fields[fi], fields[j]] = [fields[j], fields[fi]];
  save();

function addPlatform(){
  const name = prompt('새 플랫폼 이름:');
  if(!name || !name.trim()) return;
  // ID 생성: 영소문자+숫자+_ 만 허용, 한글 등 제거 후 빈 경우 'plt' 기반
  const base = name.trim().toLowerCase().replace(/[^a-z0-9]/g,'_').replace(/^_+|_+$/g,'') || 'plt';
  let id = base; let n = 2;
  while(D.platforms.find(p=>p.id===id)){ id = base + '_' + (n++); }
  D.platforms.push({id, name:name.trim(), type:'single', b:'· ', desc:'', fields:[]});
  save();
  $('pltConfig').innerHTML = renderPlatformConfig(); initPltDrag();
  render();
}

function removePlatform(pi){
  if(!confirm(`"${D.platforms[pi].name}" 플랫폼을 삭제하시겠습니까?`)) return;
  const removed = D.platforms.splice(pi, 1)[0];
  if(curPlt === removed.id) curPlt = D.platforms[0]?.id || '';
  // postedPlatforms에서 삭제된 플랫폼 ID 정리
  if(D.postedPlatforms){
    Object.keys(D.postedPlatforms).forEach(pos => {
      if(D.postedPlatforms[pos]) delete D.postedPlatforms[pos][removed.id];
    });
  }
  save();
  $('pltConfig').innerHTML = renderPlatformConfig(); initPltDrag();
  render();
}

function movePlatform(pi, dir){
  const j = pi + dir;
  if(j < 0 || j >= D.platforms.length) return;
  [D.platforms[pi], D.platforms[j]] = [D.platforms[j], D.platforms[pi]];
  save();
  $('pltConfig').innerHTML = renderPlatformConfig(); initPltDrag();
  render();
}

function renamePlatform(pi, val){
  D.platforms[pi].name = val;
  save();
  render();
}

function changePltType(pi, val){
  D.platforms[pi].type = val;
  // separate 타입으로 변경 시 fields가 없으면 기본 생성
  if(val === 'separate' && (!D.platforms[pi].fields || !D.platforms[pi].fields.length)){
    D.platforms[pi].fields = D.sections.map(s=>({l:s.name, s:[s.key]}));
  }
  save();
  $('pltConfig').innerHTML = renderPlatformConfig(); initPltDrag();
  render();
}

function changePltBullet(pi, val){
  D.platforms[pi].b = val;
  save();
  renderPreview();
}

function changePltDesc(pi, val){
  D.platforms[pi].desc = val;
  save();
}

function togglePltVisible(pi, checked){
  D.platforms[pi].hidden = !checked;
  save();
  render();
}

// ── Archive (보관처리) ──
function archivePosition(){
  if(!curPos || curPos==='__common__'){ toast('보관할 포지션을 선택하세요'); return; }
  if(!confirm((D.jobTitles[curPos]||curPos)+' 포지션을 보관처리 하시겠습니까?')) return;
  // 보관 직전 스냅샷 (Supabase 연결 시)
  if(_sb) takeCloudSnapshot('보관 전 ' + (D.jobTitles[curPos]||curPos) + ' (' + new Date().toLocaleString('ko',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) + ')', false);
  if(!D.archived) D.archived = [];
  // 원래 순서 기억 (복원 시 재삽입 위치에 사용)
  if(!D.archivedOrigOrder) D.archivedOrigOrder = {};
  D.archivedOrigOrder[curPos] = D.positions.indexOf(curPos);
  D.archived.push(curPos);
  D.positions = D.positions.filter(p=>p!==curPos);
  curPos = D.positions[0] || '__common__';
  save(); render();
  toast('보관처리 완료');
}

function restorePosition(posName){
  if(!D.archived) return;
  D.archived = D.archived.filter(p=>p!==posName);
  if(!D.positions.includes(posName)){
    // 원래 순서로 재삽입 (보관 당시 index, 현재 길이에 clamp)
    const origIdx = (D.archivedOrigOrder||{})[posName];
    if(typeof origIdx === 'number'){
      D.positions.splice(Math.min(origIdx, D.positions.length), 0, posName);
      delete D.archivedOrigOrder[posName];
    } else {
      D.positions.push(posName);
    }
  }
  save(); render();
  toast(posName+' 복원 완료');
  openArchive(); // 모달 새로고침
}

function deleteArchivedPosition(posName){
  if(!confirm(posName+' 포지션을 영구 삭제하시겠습니까?\n(데이터가 완전히 삭제됩니다)')) return;
  // 영구 삭제 직전 스냅샷
  if(_sb) takeCloudSnapshot('삭제 전 ' + posName + ' (' + new Date().toLocaleString('ko',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) + ')', false);
  if(D.archived) D.archived = D.archived.filter(p=>p!==posName);
  delete D.data[posName];
  delete D.data[posName+'__en'];
  if(D.jobTitles) delete D.jobTitles[posName];
  if(D.posLang) delete D.posLang[posName];
  if(D.posStatus) delete D.posStatus[posName];
  if(D.postedPlatforms) delete D.postedPlatforms[posName];
  save();
  toast(posName+' 영구 삭제 완료');
  openArchive();
}

function openArchive(){
  if(!D.archived) D.archived = [];
  let h = '<div class="modal-bg" onclick="if(event.target===this)closeModal()">';
  h += '<div class="modal" style="max-width:520px">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">';
  h += '<h2>📦 보관함</h2>';
  h += '<button class="btn btn-sm" onclick="closeModal()">닫기</button>';
  h += '</div>';
  if(!D.archived.length){
    h += '<p style="color:#999;font-size:13px;text-align:center;padding:20px">보관된 포지션이 없습니다.</p>';
  } else {
    D.archived.forEach(p=>{
      const jt = (D.jobTitles||{})[p] || p;
      const st = (D.posStatus||{})[p] || 'draft';
      h += `<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #eee;border-radius:6px;margin-bottom:4px;background:#fafafa">`;
      h += `<span style="flex:1;font-size:13px;font-weight:600">${esc(jt)}</span>`;
      h += `<span class="status-tag status-${st}" style="font-size:9px">${st}</span>`;
      h += `<button class="btn btn-sm btn-b" onclick="restorePosition('${escJs(p)}')">복원</button>`;
      h += `<button class="btn btn-sm btn-r" onclick="deleteArchivedPosition('${escJs(p)}')">삭제</button>`;
      h += `</div>`;
    });
  }
  h += '</div></div>';
  $('modalRoot').innerHTML = h;
}

document.addEventListener('keydown', function(e){
  // Ctrl+Z = Undo, Ctrl+Y or Ctrl+Shift+Z = Redo
  // textarea/input 내부에서는 브라우저 기본 undo 유지 (텍스트 편집 undo)
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag === 'textarea' || tag === 'input') return;
  if(e.ctrlKey && !e.altKey){
    if(e.key === 'z' && !e.shiftKey){ e.preventDefault(); undo(); }
    else if(e.key === 'y' || (e.key === 'z' && e.shiftKey)){ e.preventDefault(); redo(); }
  }
});

//
// 테이블 구조:
//   config           — 섹션·플랫폼 설정 (1행)

const SB_LS_KEY = LS_KEY + '_sb';
let _sb = null;
let _sbConf = JSON.parse(localStorage.getItem(SB_LS_KEY) || 'null');

// ── F10: 활동 로그 (recruit_activity_log) ──
// 모든 동기화/오류 이벤트를 Supabase에 누적, 사후 디버깅 + 패턴 분석
const CLIENT_ID = (function(){
  const k = 'jobpost_client_id';
  let v = localStorage.getItem(k);
  if(!v){ v = 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); localStorage.setItem(k, v); }
  return v;
})();
const ACTIVITY_LOG_MAX = 500; // 보관 최대 개수 (초과 시 오래된 것 삭제)
let _activityBuffer = []; // 오프라인 시 임시 보관

async function logActivity(eventType, level, message, context){
  const entry = {
    event_type: eventType,
    level: level || 'info',
    message: message || '',
    context: context || {},
    client_id: CLIENT_ID
  };
  // 콘솔에도 미러링 (디버깅 즉시성)
  const tag = `[ACT:${eventType}/${level||'info'}]`;
  if(level === 'error') console.error(tag, message, context);
  else if(level === 'warn') console.warn(tag, message, context);
  else console.log(tag, message, context);
  // Supabase 미연결 시 버퍼링
  if(!_sb){
    _activityBuffer.push(entry);
    if(_activityBuffer.length > 100) _activityBuffer.shift();
    return;
  }
  try {
    // 버퍼 flush + 현재 entry
    const rows = _activityBuffer.length ? [..._activityBuffer, entry] : [entry];
    _activityBuffer = [];
    await _sb.from('recruit_activity_log').insert(rows);
    // 보관 정책: 최대 ACTIVITY_LOG_MAX 개 (가벼운 정리, push 마다 가끔)
    if(Math.random() < 0.05){ // 5% 확률로 정리 (성능 부담 분산)
      const { data: ids } = await _sb.from('recruit_activity_log').select('id').order('ts', {ascending: false}).range(ACTIVITY_LOG_MAX, ACTIVITY_LOG_MAX + 100);
      if(ids && ids.length){
        const oldIds = ids.map(r => r.id);
        await _sb.from('recruit_activity_log').delete().in('id', oldIds);
      }
    }
  } catch(e){
    // 로그 자체 실패는 silent (무한 루프 방지)
    console.warn('logActivity 저장 실패:', e.message);
  }
}

    .select('*').order('ts', {ascending: false}).limit(limit || 20);
  if(error){ console.warn('listActivityLog 실패:', error); return []; }
  return data || [];
}

  const dot = $('syncDot');
  if(dot) dot.className = 'sync-dot ' + status;
