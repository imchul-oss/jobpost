// _sbInit: 페이지 로드 시 vs 사용자 재연결 시 분기
// - autoSync='pull' (기본, 페이지 로드): cloud 데이터 가져옴
// - autoSync='push': dirty 변경분 있으면 push 우선 (재연결용)
// - autoSync='auto' (권장): dirty 자동 감지, push→pull or pull
function _sbInit(autoSync){
  if(!_sbConf || !_sbConf.url || !_sbConf.key){ _sb = null; _sbDot('off'); return; }
  try {
    _sb = supabase.createClient(_sbConf.url, _sbConf.key);
    _sbDot('ok');
    if(autoSync === 'push'){
      _sbPush();
    } else if(autoSync === 'auto'){
      // dirty 우선: 로컬 변경분 있으면 push 후 pull, 없으면 pull
      if(_dirty){
        toast('로컬 변경 감지 — 푸시 후 동기화');
        _sbPush().then(()=> _sbPull());
      } else {
        _sbPull();
      }
    } else {
      // 기본: pull (페이지 로드 시 정상 동작)
      _sbPull();
    }
  } catch(e){
    console.warn('Supabase 초기화 실패:', e);
    toast('연결 실패: ' + (e.message||e));
    _sb = null; _sbDot('err');
  }
}

// ── Push: 로컬 D → Supabase (upsert + 선택적 삭제, delete-all 제거) ──
async function _sbPush(){
  if(!_sb) return;
  _sbDot('syncing');
  const now = new Date().toISOString();
  try {
    // 1) config — 섹션 + 플랫폼 + LB + 보관 목록
    {
      const row = { id: 'default', sections: D.sections, platforms: D.platforms, line_breaks: LB, archived: D.archived || [], updated_at: now };
      const { error } = await _sb.from('config').upsert(row, { onConflict: 'id' });
      if(error) throw error;
    }

    // 2) positions — 활성 + 보관 모두 upsert (is_archived 구분), FK 보존
    {
      if(!D.posStatus) D.posStatus = {};
      if(!D.metadata) D.metadata = {};
      // metadata 정리: _opened 같은 내부 UI state 제거 후 push
      const cleanMeta = (p) => {
        const src = (D.metadata||{})[p] || {};
        const out = {};
        Object.keys(src).forEach(k => { if(k !== '_opened') out[k] = src[k]; });
        return out;
      };
      const activeRows = D.positions.map((p, i) => ({
        name: p, job_title: (D.jobTitles||{})[p] || p,
        lang: (D.posLang||{})[p] || 'ko', status: (D.posStatus||{})[p] || 'draft',
        sort_order: i, is_archived: false, metadata: cleanMeta(p), updated_at: now
      }));
      const archivedRows = (D.archived||[]).map((p, i) => ({
        name: p, job_title: (D.jobTitles||{})[p] || p,
        lang: (D.posLang||{})[p] || 'ko', status: 'archived',
        sort_order: 9000 + i, is_archived: true, metadata: cleanMeta(p), updated_at: now
      }));
      const allRows = [...activeRows, ...archivedRows];
      if(allRows.length){
        let { error } = await _sb.from('positions').upsert(allRows, { onConflict: 'name' });
        // metadata 컬럼이 아직 없는 Supabase 스키마 — graceful fallback
        // PostgREST 에러 메시지에 'metadata' + 'column' 패턴 또는 PGRST204(스키마 캐시 누락) 감지
        if(error && /metadata/i.test(error.message||'') && (/column/i.test(error.message||'') || error.code === 'PGRST204')){
          if(!window._jpMetaWarned){
            console.info('[jobpost] positions.metadata 컬럼이 아직 없어 메타필드를 제외하고 동기화합니다. schema.sql(v0.8.0+) 재실행 또는 v0.11.0-metadata 마이그레이션 적용 권장.');
            toast('⚠ 메타필드는 동기화 제외됨 — schema.sql 최신 버전을 한 번 실행하세요');
            window._jpMetaWarned = true;
          }
          const stripped = allRows.map(({ metadata, ...rest }) => rest);
          const retry = await _sb.from('positions').upsert(stripped, { onConflict: 'name' });
          if(retry.error) throw retry.error;
        } else if(error) {
          throw error;
        }
      }
      // 활성/보관 어디에도 없는 포지션만 삭제 (전체 delete 금지)
      const keepNames = allRows.map(r => r.name);
      const { data: existPos } = await _sb.from('positions').select('name');
      const stale = (existPos||[]).map(r => r.name).filter(n => !keepNames.includes(n));
      if(stale.length) await _sb.from('positions').delete().in('name', stale);
    }

    // 3) posting_urls
    // ⚠ 이 테이블은 jd-extension(브리지)도 같이 쓴다.
    //   확장이 등록한 실제 페이지 URL은 🎯 자동 매칭의 근거이므로 절대 덮어쓰거나 지우면 안 됨.
    //   jobpost가 만드는 row는 url='Y' 마커뿐 — insert/삭제 모두 'Y' 마커에만 적용한다.
    try {
      if(!D.postedPlatforms) D.postedPlatforms = {};
      const checkedPairs = [];
      Object.keys(D.postedPlatforms).forEach(posName => {
        Object.keys(D.postedPlatforms[posName]||{}).forEach(pltId => {
          if(D.postedPlatforms[posName][pltId]) checkedPairs.push({ position_name: posName, platform_id: pltId });
        });
      });
      const checkedKeys = new Set(checkedPairs.map(p => p.position_name + '||' + p.platform_id));
      const { data: existUrls } = await _sb.from('posting_urls').select('position_name,platform_id,url');
      const existKeys = new Set((existUrls||[]).map(r => r.position_name + '||' + r.platform_id));
      // 새로 체크된 페어만 insert — 이미 있는 row는 확장이 등록한 실제 URL일 수 있으므로 건드리지 않음
      const newRows = checkedPairs
        .filter(p => !existKeys.has(p.position_name + '||' + p.platform_id))
        .map(p => ({ position_name: p.position_name, platform_id: p.platform_id, url: 'Y', updated_at: now }));
      if(newRows.length){
        const { error } = await _sb.from('posting_urls').upsert(newRows, { onConflict: 'position_name,platform_id' });
        if(error) throw error;
      }
      // 체크 해제된 페어 삭제 — 단, jobpost가 만든 url='Y' 마커만.
      // posting_urls 테이블엔 단일 PK 'id' 가 없고 복합키만 있으므로 페어별 개별 delete (Promise.all 병렬)
      const stalePairs = (existUrls||[])
        .filter(r => r.url === 'Y' && !checkedKeys.has(r.position_name + '||' + r.platform_id));
      if(stalePairs.length){
        await Promise.all(stalePairs.map(r =>
          _sb.from('posting_urls').delete().eq('position_name', r.position_name).eq('platform_id', r.platform_id).eq('url', 'Y')
        ));
      }
    } catch(pe){ console.warn('posting_urls push 건너뜀:', pe); }

    // 4) common_content — upsert + 삭제된 섹션 stale 정리
    {
      const rows = [];
      ['ko','en'].forEach(lang => {
        const dk = lang === 'en' ? '공통_en' : '공통';
        const obj = D.data[dk] || {};
        Object.keys(obj).forEach(secKey => {
          if(obj[secKey]) rows.push({ lang, section_key: secKey, content: obj[secKey], updated_at: now });
        });
      });
      if(rows.length){
        const { error } = await _sb.from('common_content').upsert(rows, { onConflict: 'lang,section_key' });
        if(error) throw error;
      }
      // 삭제된 섹션 stale row 제거
      try {
        const keepCC = new Set(rows.map(r => r.lang + '||' + r.section_key));
        const { data: existCC } = await _sb.from('common_content').select('lang,section_key');
        const staleCC = (existCC||[]).filter(r => !keepCC.has(r.lang + '||' + r.section_key));
        if(staleCC.length){
          await Promise.all(staleCC.map(sc =>
            _sb.from('common_content').delete().eq('lang', sc.lang).eq('section_key', sc.section_key)
          ));
        }
      } catch(ce){ console.warn('common_content stale 정리 건너뜀:', ce); }
    }

    // 5) position_content — 활성 + 보관 포지션 모두 포함 (내용 보존)
    {
      const allPos = [...D.positions, ...(D.archived||[])];
      const rows = [];
      allPos.forEach(p => {
        ['ko','en'].forEach(lang => {
          const dk = lang === 'en' ? p + '__en' : p;
          const obj = D.data[dk] || {};
          Object.keys(obj).forEach(secKey => {
            if(obj[secKey]) rows.push({ position_name: p, lang, section_key: secKey, content: obj[secKey], updated_at: now });
          });
        });
      });
      // upsert 100건씩 배치
      for(let i = 0; i < rows.length; i += 100){
        const { error } = await _sb.from('position_content').upsert(rows.slice(i, i+100), { onConflict: 'position_name,lang,section_key' });
        if(error) throw error;
      }
      // stale 정리 — (position_name, lang, section_key) 페어 단위 (common_content와 동일 방식)
      // ① 포지션 자체가 사라진 경우 + ② 포지션은 남았지만 섹션 내용이 비워지거나 섹션이 삭제된 경우 모두 처리
      // (②가 없으면 비운 텍스트가 다음 pull 때 클라우드에서 부활함)
      if(allPos.length){
        try {
          const keepPC = new Set(rows.map(r => r.position_name + '||' + r.lang + '||' + r.section_key));
          const { data: existPc } = await _sb.from('position_content').select('position_name,lang,section_key');
          const stalePosSet = new Set();
          const stalePairs = [];
          (existPc||[]).forEach(r => {
            if(!allPos.includes(r.position_name)){ stalePosSet.add(r.position_name); return; }
            if(!keepPC.has(r.position_name + '||' + r.lang + '||' + r.section_key)) stalePairs.push(r);
          });
          if(stalePosSet.size) await _sb.from('position_content').delete().in('position_name', [...stalePosSet]);
          if(stalePairs.length){
            await Promise.all(stalePairs.map(r =>
              _sb.from('position_content').delete().eq('position_name', r.position_name).eq('lang', r.lang).eq('section_key', r.section_key)
            ));
          }
        } catch(pce){ console.warn('position_content stale 정리 건너뜀:', pce); }
      }
    }

    _sbDot('ok');
    _dirty = false;
    const autoLabel = 'Auto ' + new Date().toLocaleString('ko', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    takeCloudSnapshot(autoLabel, true);
    logActivity('push', 'info', '동기화 완료', { positions: D.positions.length, archived: (D.archived||[]).length });
  } catch(e){
    console.warn('Supabase push 실패:', e);
    toast('Push 실패: ' + (e.message||e));
    _sbDot('err');
    logActivity('push', 'error', e.message||String(e), { stack: (e.stack||'').slice(0,500) });
  }
}

// ── Pull: 4개 테이블 → 로컬 D 재구성 ──
async function _sbPull(){
  if(!_sb) return;
  _sbDot('syncing');
  // Safety net: pull로 D가 통째 덮어씌워지므로, 진입 직전 로컬 스냅샷을 별도 키에 보관
  // (pull 중 사용자 변경 손실 시 복구 가능)
  try {
    const beforeSnap = { ts: Date.now(), dirty: _dirty, D: D };
    localStorage.setItem('jobpost_safety_before_pull', JSON.stringify(beforeSnap));
  } catch(e){ /* 용량 초과 등 무시 */ }
  try {
    // 1) config
    const { data: cfgRows, error: e1 } = await _sb.from('config').select('*').eq('id','default').limit(1);
    if(e1) throw e1;

    // 서버에 데이터가 없으면 현재 데이터 push
    if(!cfgRows || !cfgRows.length){
      _sbDot('ok');
      _sbPush();
      return;
    }

    // 2) positions
    const { data: posRows, error: e2 } = await _sb.from('positions').select('*').order('sort_order');
    if(e2) throw e2;

    // 3) common_content
    const { data: ccRows, error: e3 } = await _sb.from('common_content').select('*');
    if(e3) throw e3;

    // 4) position_content
    const { data: pcRows, error: e4 } = await _sb.from('position_content').select('*');
    if(e4) throw e4;

    // 5) posting_urls
    const { data: urlRows, error: e5 } = await _sb.from('posting_urls').select('*');
    // posting_urls 테이블이 없을 수 있음 (구버전) — 무시
    if(e5 && !e5.message.includes('does not exist')) throw e5;

    // ── 로컬 D 재구성 ──
    _skipSnapshot = true;

    // config + LB + 보관 목록
    const cfg = cfgRows[0];
    if(cfg.sections) D.sections = cfg.sections;
    if(cfg.platforms) D.platforms = cfg.platforms;
    if(cfg.line_breaks){
      LB = cfg.line_breaks;
      localStorage.setItem(LS_KEY_LB, JSON.stringify(LB));
      $('lbBetween').textContent = LB.between;
      $('lbWithin').textContent = LB.within;
    }
    // 보관 목록: Supabase 값 우선, 없으면 로컬 유지
    D.archived = Array.isArray(cfg.archived) ? cfg.archived : (D.archived || []);

    // positions — is_archived로 활성/보관 분리
    D.positions = (posRows||[]).filter(r => !r.is_archived).map(r => r.name);
    // D.archived: config.archived 우선, 없으면 positions 테이블의 is_archived=true 목록
    const archivedFromPos = (posRows||[]).filter(r => r.is_archived).map(r => r.name);
    D.archived = Array.isArray(cfg.archived) && cfg.archived.length
      ? cfg.archived
      : archivedFromPos;
    D.jobTitles = {};
    D.posLang = {};
    D.posStatus = {};
    D.metadata = {};
    (posRows||[]).forEach(r => {
      D.jobTitles[r.name] = r.job_title || r.name;
      D.posLang[r.name] = r.lang || 'ko';
      D.posStatus[r.name] = r.is_archived ? 'archived' : (r.status || 'draft');
      // metadata: 컬럼이 없으면 r.metadata === undefined, 있으면 객체. 항상 객체 보장.
      D.metadata[r.name] = (r.metadata && typeof r.metadata === 'object') ? r.metadata : {};
    });

    // common_content
    D.data['공통'] = {};
    D.data['공통_en'] = {};
    (ccRows||[]).forEach(r => {
      const dk = r.lang === 'en' ? '공통_en' : '공통';
      D.data[dk][r.section_key] = r.content;
    });

    // position_content — 활성 + 보관 포지션 모두 복원
    const allRestoredPos = [...D.positions, ...(D.archived||[])];
    allRestoredPos.forEach(p => {
      D.data[p] = {};
      D.data[p + '__en'] = {};
    });
    (pcRows||[]).forEach(r => {
      const dk = r.lang === 'en' ? r.position_name + '__en' : r.position_name;
      if(!D.data[dk]) D.data[dk] = {};
      D.data[dk][r.section_key] = r.content;
    });

    // posting_urls → postedPlatforms (boolean)
    D.postedPlatforms = {};
    (urlRows||[]).forEach(r => {
      if(!D.postedPlatforms[r.position_name]) D.postedPlatforms[r.position_name] = {};
      D.postedPlatforms[r.position_name][r.platform_id] = true;
    });

    // 로컬 저장
    const json = JSON.stringify(D);
    try{ localStorage.setItem(LS_KEY, json); }catch(e){}
    if(typeof localforage !== 'undefined') localforage.setItem(LS_KEY, json).catch(()=>{});

    _skipSnapshot = false;
    if(curPos !== '__common__' && !D.positions.includes(curPos)) curPos = D.positions[0] || '';
    render();
    toast('클라우드에서 동기화 완료');
    _sbDot('ok');
    logActivity('pull', 'info', '클라우드 → 로컬 복원 완료', { positions: D.positions.length, archived: (D.archived||[]).length });
    // pull 후 dirty 변경분 손실 가능성 검사 → 사용자에게 복구 옵션 제시
    checkSafetyDiff();
  } catch(e){
    console.warn('Supabase pull 실패:', e);
    toast('Pull 실패: ' + (e.message||e));
    _sbDot('err');
    logActivity('pull', 'error', e.message||String(e), { stack: (e.stack||'').slice(0,500) });
  }
}

// ── 안전 백업 비교: pull 직전 로컬과 pull 후 D 비교, 차이 있으면 사용자 알림 ──
function checkSafetyDiff(){
  try {
    const raw = localStorage.getItem('jobpost_safety_before_pull');
    if(!raw) return;
    const snap = JSON.parse(raw);
    if(!snap || !snap.D) return;
    // dirty 였던 경우만 알림 (정상 pull과 구분)
    if(!snap.dirty) return;
    // 단순 비교: D.data 의 텍스트 길이 합산이 줄었는지
    const oldLen = JSON.stringify(snap.D.data || {}).length;
    const newLen = JSON.stringify(D.data || {}).length;
    if(oldLen > newLen + 100){ // 100자 이상 손실 시 (오차 범위 무시)
      const lossKB = Math.round((oldLen - newLen)/1024 * 10)/10;
      const ok = confirm(
        `⚠️ 데이터 손실 감지\n\n` +
        `클라우드 동기화 직전 로컬에 변경 사항이 있었으나, 클라우드 데이터로 덮어씌워졌습니다.\n` +
        `손실 추정: 약 ${lossKB}KB\n\n` +
        `[확인]을 누르면 직전 로컬 데이터로 복구합니다.\n` +
        `[취소]를 누르면 현재 클라우드 데이터를 유지합니다 (복구 키는 7일간 보존됨).`
      );
      if(ok){
        D = snap.D;
        save();
        render();
        toast('직전 로컬 데이터로 복구 완료');
        // 복구 후엔 즉시 push (클라우드도 갱신)
        if(_sb) setTimeout(_sbPush, 500);
      }
    }
  } catch(e){ console.warn('safety diff 검사 실패:', e); }
}

// ── 클라우드 스냅샷 (recruit_snapshots 테이블, 구조화면접 등 타 프로젝트와 충돌 없음) ──
const SNAP_MAX = 48;         // 최대 보관 개수
const SNAP_AUTO_INTERVAL = 60 * 60 * 1000; // 자동 스냅샷 간격: 1시간
let _lastCloudSnapTime = 0;

// label: 표시 이름, auto: true면 중복 방지 시간 체크 적용
async function takeCloudSnapshot(label, auto){
  if(!_sb) return;
  if(auto && (Date.now() - _lastCloudSnapTime) < SNAP_AUTO_INTERVAL) return;
  try {
    const { error } = await _sb.from('recruit_snapshots').insert({ label, data: D });
    if(error) throw error;
    _lastCloudSnapTime = Date.now();
    // 오래된 스냅샷 정리 (SNAP_MAX 초과분 삭제)
    const { data: rows } = await _sb.from('recruit_snapshots')
      .select('id').order('created_at', { ascending: false }).range(SNAP_MAX, 9999);
    if(rows && rows.length){
      const ids = rows.map(r => r.id);
      await _sb.from('recruit_snapshots').delete().in('id', ids);
    }
    if(!auto) toast('스냅샷 저장됨');
  } catch(e){ console.warn('스냅샷 실패:', e); }
}

async function listCloudSnapshots(){
  if(!_sb) return [];
  try {
    const { data, error } = await _sb.from('recruit_snapshots')
      .select('id, label, created_at').order('created_at', { ascending: false }).limit(SNAP_MAX);
    if(error) throw error;
    return data || [];
  } catch(e){ return []; }
}

async function restoreCloudSnapshot(id){
  if(!_sb) return;
  if(!confirm('이 스냅샷으로 복원하면 현재 데이터가 덮어씌워집니다. 계속하시겠습니까?')) return;
  try {
    const { data, error } = await _sb.from('recruit_snapshots').select('data, label, created_at').eq('id', id).single();
    if(error) throw error;
    // 복원 전 현재 상태 스냅샷 저장
    await takeCloudSnapshot('복원 직전 자동 백업 (' + new Date().toLocaleString('ko') + ')', false);
    _skipSnapshot = true;
    D = data.data;
    const json = JSON.stringify(D);
    localStorage.setItem(LS_KEY, json);
    if(typeof localforage !== 'undefined') localforage.setItem(LS_KEY, json).catch(()=>{});
    _skipSnapshot = false;
    if(curPos !== '__common__' && !D.positions.includes(curPos)) curPos = D.positions[0] || '';
    render();
    closeModal();
    toast('스냅샷 복원 완료: ' + data.label);
    setTimeout(_sbPush, 1000); // 복원된 데이터를 cloud에도 반영
  } catch(e){ toast('복원 실패: ' + (e.message||e)); }
}

// save() 후 자동 push (3초 디바운스)
let _sbPushTimer = null;
const _origSave = save;
save = function(){
  _origSave();
  if(_sb){
    clearTimeout(_sbPushTimer);
    _sbPushTimer = setTimeout(_sbPush, 3000);
  }
};

function syncNow(){
  if(!_sb){ toast('Supabase가 연결되지 않았습니다'); return; }
  clearTimeout(_sbPushTimer);
  toast('동기화 중...');
  // push 먼저 (로컬 변경사항 보존) → pull (클라우드 최신 반영)
  _sbPush().then(() => _sbPull());
}

// ── Supabase 설정 모달 ──
const _SB_SQL = `-- 1) 앱 설정 (섹션·플랫폼·줄바꿈)
create table config (
  id text primary key default 'default',
  sections jsonb,
  platforms jsonb,
  line_breaks jsonb,
  archived jsonb default '[]',
  updated_at timestamptz default now()
);
-- 기존 테이블에 archived 컬럼이 없을 경우 실행:
-- alter table config add column if not exists archived jsonb default '[]';

-- 2) 포지션 목록 + 상태 (is_archived: 보관 포지션도 보존하여 content FK 유지)
create table positions (
  name text primary key,
  job_title text,
  lang text default 'ko',
  status text default 'draft',
  sort_order int default 0,
  is_archived boolean default false,
  updated_at timestamptz default now()
);
-- 기존 테이블 업그레이드: alter table positions add column if not exists is_archived boolean default false;

-- 3) 공통 데이터 (KO/EN × 섹션)
create table common_content (
  lang text not null,
  section_key text not null,
  content text,
  updated_at timestamptz default now(),
  primary key (lang, section_key)
);

-- 4) 포지션별 데이터 (포지션 × KO/EN × 섹션)
create table position_content (
  position_name text not null references positions(name) on delete cascade,
  lang text not null,
  section_key text not null,
  content text,
  updated_at timestamptz default now(),
  primary key (position_name, lang, section_key)
);

-- 5) 포지션별 플랫폼 게시 URL
create table posting_urls (
  position_name text not null references positions(name) on delete cascade,
  platform_id text not null,
  url text,
  updated_at timestamptz default now(),
  primary key (position_name, platform_id)
);

-- 6) 스냅샷 (채용공고관리 전용, 다른 프로젝트와 충돌 방지용 recruit_ prefix)
create table recruit_snapshots (
  id bigint generated always as identity primary key,
  label text not null,
  data jsonb not null,
  created_at timestamptz default now()
);

-- RLS 정책 (인증 없이 접근 허용)
alter table config enable row level security;
alter table positions enable row level security;
alter table common_content enable row level security;
alter table position_content enable row level security;
alter table posting_urls enable row level security;
alter table recruit_snapshots enable row level security;

create policy "Allow all" on config for all using (true) with check (true);
create policy "Allow all" on positions for all using (true) with check (true);
create policy "Allow all" on common_content for all using (true) with check (true);
create policy "Allow all" on position_content for all using (true) with check (true);
create policy "Allow all" on posting_urls for all using (true) with check (true);
create policy "Allow all" on recruit_snapshots for all using (true) with check (true);`;

function openSupabaseMgr(){
  const conf = _sbConf || {};
  let h = '<div class="modal-bg" onclick="if(event.target===this)closeModal()">';
  h += '<div class="modal" style="max-width:580px">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">';
  h += '<h2>☁️ 클라우드 동기화 (Supabase)</h2>';
  h += '<button class="btn btn-sm" onclick="closeModal()">닫기</button>';
  h += '</div>';

  h += '<p style="font-size:12px;color:#888;margin-bottom:14px;line-height:1.6">';
  h += '5개 정규화 테이블에 데이터를 분리 저장합니다.<br>';
  h += '<strong>config</strong>(설정+LB) · <strong>positions</strong>(포지션+상태) · <strong>common_content</strong>(공통KO/EN) · <strong>position_content</strong>(포지션별KO/EN) · <strong>posting_urls</strong>(게시URL)</p>';

  h += '<details style="margin-bottom:14px;border:1px solid #eee;border-radius:8px;padding:10px 12px;background:#f9f9f9">';
  h += '<summary style="font-size:12px;font-weight:700;cursor:pointer;color:#4DD2A7">📘 Supabase 프로젝트 생성 가이드</summary>';
  h += '<div style="font-size:11px;color:#666;line-height:1.8;margin-top:8px">';
  h += '1. <a href="https://supabase.com" target="_blank" style="color:#4DD2A7">supabase.com</a> 가입 → <strong>New Project</strong><br>';
  h += '2. <strong>SQL Editor</strong>에서 아래 SQL 전체 복사·실행<br>';
  h += '3. <strong>Settings → API</strong>에서 URL + anon key 복사<br>';
  h += '4. 아래에 붙여넣기 → 연결</div>';
  h += `<div style="margin-top:8px;position:relative"><button class="btn btn-sm" onclick="navigator.clipboard.writeText(_SB_SQL);toast('SQL 복사됨')" style="position:absolute;top:4px;right:4px;z-index:1">복사</button>`;
  h += `<pre style="background:#222;color:#0f0;padding:8px;border-radius:6px;font-size:10px;overflow-x:auto;max-height:200px;overflow-y:auto;margin:0;white-space:pre">${esc(_SB_SQL)}</pre></div>`;
  h += '</details>';

  h += '<div class="field"><label>Project URL</label>';
  h += `<input id="sbUrl" value="${esc(conf.url||'')}" placeholder="https://xxxxx.supabase.co"></div>`;
  h += '<div class="field"><label>Anon Key</label>';
  h += `<input id="sbKey" type="password" value="${esc(conf.key||'')}" placeholder="eyJhbGciOiJIUzI1NiIs..."></div>`;

  h += '<div style="display:flex;gap:6px;align-items:center;margin-top:14px">';
  h += `<span class="sync-dot ${_sbStatus}" style="width:10px;height:10px"></span>`;
  h += `<span style="font-size:12px;color:#666">${_sbStatus==='ok'?'연결됨':_sbStatus==='err'?'연결 실패':_sbStatus==='syncing'?'동기화 중...':'미연결'}</span>`;
  h += '<button class="btn btn-sm" onclick="sbDisconnect()">연결 해제</button>';
  h += '<button class="btn btn-sm btn-b" onclick="sbConnect()">연결</button>';
  h += '<button class="btn btn-sm btn-g" onclick="syncNow();closeModal()">지금 동기화</button>';
  h += '</div>';

  // 스냅샷 섹션 (연결 상태일 때만)
  if(_sbStatus === 'ok' || _sbStatus === 'syncing'){
    h += '<div style="margin-top:18px;border-top:1px solid #eee;padding-top:14px">';
    h += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">';
    h += '<span style="font-size:12px;font-weight:700">📸 스냅샷 백업</span>';
    h += `<button class="btn btn-sm btn-b" onclick="takeCloudSnapshot('수동 백업 '+new Date().toLocaleString('ko',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),false).then(()=>openSupabaseMgr())">지금 백업</button>`;
    h += '</div>';
    h += '<div id="snapList" style="font-size:11px;color:#999;text-align:center;padding:8px">불러오는 중...</div>';
    h += '</div>';

    // F10: 활동 로그 섹션 (연결 상태일 때만)
    h += '<div style="margin-top:14px;border-top:1px solid #eee;padding-top:14px">';
    h += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">';
    h += '<span style="font-size:12px;font-weight:700">📝 활동 로그</span>';
    h += '<span style="font-size:10px;color:#aaa">최근 20건</span>';
    h += '<span style="flex:1"></span>';
    h += '<button class="btn btn-sm" onclick="(async()=>{const r=await listActivityLog(20);const el=$(\'actList\');if(!el)return;if(!r.length){el.textContent=\'로그 없음\';return;}let s=\'\';r.forEach(a=>{const dt=new Date(a.ts).toLocaleString(\'ko\',{month:\'2-digit\',day:\'2-digit\',hour:\'2-digit\',minute:\'2-digit\',second:\'2-digit\'});const c=a.level===\'error\'?\'#dc2626\':a.level===\'warn\'?\'#d97706\':\'#666\';s+=`<div style=\"display:flex;gap:6px;padding:3px 0;border-bottom:1px solid #f0f0f0;font-size:10px\"><span style=\"color:#aaa;white-space:nowrap;font-family:monospace\">${dt}</span><span style=\"color:${c};font-weight:600;min-width:50px\">${a.event_type}</span><span style=\"color:#444;flex:1\">${esc(a.message||\'\')}</span></div>`});el.innerHTML=s;})()" style="font-size:10px;padding:2px 8px">새로고침</button>';
    h += '</div>';
    h += '<div id="actList" style="font-size:10px;color:#999;text-align:center;padding:8px;max-height:200px;overflow-y:auto">[새로고침] 클릭하여 조회</div>';
    h += '</div>';
  }

  h += '</div></div>';
  $('modalRoot').innerHTML = h;

  // 스냅샷 목록 비동기 로드
  if(_sbStatus === 'ok' || _sbStatus === 'syncing'){
    listCloudSnapshots().then(snaps => {
      const el = $('snapList');
      if(!el) return;
      if(!snaps.length){ el.textContent = '저장된 스냅샷이 없습니다'; return; }
      let s = '<div style="display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto">';
      snaps.forEach(sn => {
        const dt = new Date(sn.created_at).toLocaleString('ko',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
        s += `<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #f0f0f0">`;
        s += `<span style="flex:1;color:#444;font-size:11px">${esc(sn.label)}</span>`;
        s += `<span style="color:#aaa;white-space:nowrap">${dt}</span>`;
        s += `<button class="btn btn-sm" style="padding:2px 6px;font-size:10px" onclick="restoreCloudSnapshot(${sn.id})">복원</button>`;
        s += '</div>';
      });
      s += '</div>';
      el.innerHTML = s;
    });
  }
}

function sbConnect(){
  const url = $('sbUrl').value.trim().replace(/\/+$/, '');
  const key = $('sbKey').value.trim();
  if(!url || !key){ toast('URL과 Key를 모두 입력하세요'); return; }
  _sbConf = { url, key };
  localStorage.setItem(SB_LS_KEY, JSON.stringify(_sbConf));
  _sbInit('auto');
  closeModal();
  setTimeout(()=> logActivity('connect', 'info', '사용자가 연결', { dirty: _dirty }), 100);
}

function sbDisconnect(){
  logActivity('disconnect', 'info', '사용자가 연결 해제');
  _sbConf = null; _sb = null;
  localStorage.removeItem(SB_LS_KEY);
  _sbDot('off');
  toast('클라우드 연결 해제됨');
  closeModal();
}

if(_sbConf) _sbInit();

window.addEventListener('online', ()=>{
  if(_sb && _dirty){
    toast('네트워크 복귀 — 자동 푸시 시도');
    setTimeout(_sbPush, 500);
  }
});
